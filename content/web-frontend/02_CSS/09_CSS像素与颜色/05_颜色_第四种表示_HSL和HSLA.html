<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>05_颜色_第四种表示_HSL和HSLA</title>
    <style>
        /* hsl(色相，饱和度，亮度) */
        .one {
            color: hsl(0deg, 100%, 50%);
        }
        .two {
            color: hsl(60deg, 100%, 50%);
        }
        .three {
            color: hsl(120deg, 100%, 50%);
        }
        .four {
            color: hsl(240deg, 100%, 50%);
        }
        .five {
            color: hsl(300deg, 100%, 50%);
        }
        .six {
            color: hsla(300deg, 100%, 50%, 0.5);
        }
    </style>
</head>
<body>
    <h1 class="one">尚硅谷</h1>
    <h1 class="two">尚硅谷</h1>
    <h1 class="three">尚硅谷</h1>
    <h1 class="four">尚硅谷</h1>
    <h1 class="five">尚硅谷</h1>
    <h1 class="six">尚硅谷</h1>
</body>
</html>
