<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML表单常用控件</title>
</head>
<body>
    <form action="https://search.jd.com/search" target="_blank">

        <!--<value="">表示框内的初始值 | <maxlength=""表示可输入的最长字符-->
        <!--文本输入框-->
        账户：<input type="text" name="account"><br>
        <!--密码输入框-->
        密码：<input type="password" name="word"><br>
        
        <!--单选框-->
        性别:
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女
        <br>
        
        <!--多选框-->
        爱好：
        <!--<checked="">表示默认值-->
        <input type="checkbox" name="hobby" value="Basketball">打篮球
        <input type="checkbox" name="hobby" value="Games">玩游戏
        <input type="checkbox" name="hobby" value="Code">敲代码
        <br>
        
        <!--隐藏域-->
        <input type="hidden" name="tag" value="123">
        
        其他：
        <textarea name="other" cols="22" rows="4"></textarea>
        <br><br>

        籍贯：
        <select name="place">              
            <option value="赣">江西省</option>
            <option value="粤">广东省</option>
            <option value="晋">山西省</option>
            <option value="蜀">四川省</option>
            <option value="湘">湖南省</option>
            <option value="" selected></option>
        </select>
        <br><br>
        
        <!--第一种确认按钮写法-->
        <!--<button>确认</button>--> <!--按钮后面最不要加<value="">属性-->
        
        <!--第二种确认按钮写法-->
        <input type="submit" value="确认">
        
        <!--第一种重置按钮写法-->
        <!-- <button type="reset">重置</button> -->
        
        <!--第二种重置按钮写法-->
        <input type="reset" value="重置">
        
        <!--第一种普通按钮写法-->
        <!-- <button>检测账户是否被注册</button> -->

        <!--第二种普通按钮写法-->
        <input type="button" value="检测账户是否被注册">
    </form>
</body>
</html>
