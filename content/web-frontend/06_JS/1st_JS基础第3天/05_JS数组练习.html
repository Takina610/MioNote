    let arr = [2, 6, 1, 77, 52, 25, 7]
    let max = arr[0]
    let min = arr[0]
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] < min) {
        min = arr[i]
      }
      if (arr[i] > max) {
        max = arr[i]
      }
    }
    document.write(`数组的最大值是：${max}`)
    document.write(`数组的最小值是：${min}`)
