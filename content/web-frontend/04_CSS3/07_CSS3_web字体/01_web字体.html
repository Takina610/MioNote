<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_web字体</title>
    <style>
        @font-face {
            font-family: "LJH";
            src: url('./字体1/方正手迹.ttf');
        }
        @font-face {
            font-family: "YYDS";
            font-display: swap;
            src: url('./字体2/webfont.eot'); /* IE9 */
            src: url('./字体2/webfont.eot?#iefix') format('embedded-opentype'), /* IE6-IE8 */
            url('./字体2/webfont.woff2') format('woff2'),
            url('./字体2/webfont.woff') format('woff'), /* chrome、firefox */
            url('./字体2/webfont.ttf') format('truetype'), /* chrome、firefox、opera、Safari, Android, iOS 4.2+*/
            url('./字体2/webfont.svg#webfont') format('svg'); /* iOS 4.1- */
}
        .box1 {
            font-size: 60px;
            font-family: "LJH";
        }
        .box2 {
            font-size: 60px;
            font-family: "YYDS";
        }

    </style>
</head>
<body>
    <div class="box1">我允许你走进我的世界,但不许你在我的世界里走来走去。</div>
    <div class="box2">我允许你走进我的世界,但不许你在我的世界里走来走去。</div>
</body>
</html>
