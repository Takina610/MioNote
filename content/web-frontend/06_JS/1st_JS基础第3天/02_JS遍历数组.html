<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_JS遍历数组</title>
</head>
<body>
  <script>
    let arr = ['马超', '赵云', '关羽', '张飞', '黄忠']
    for (let i = 0; i < arr.length; i++) {
      document.write(arr[i])
    }
  </script>
</body>
</html>
