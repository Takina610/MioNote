<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10_伪数组转换为真数组</title>
</head>
<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>
  <script>
    const lis = document.querySelectorAll('ul li') // 得到一个伪数组

    const trueLis = Array.from(lis)
    trueLis.pop()
    console.log(trueLis)
  </script>
</body>
</html>
