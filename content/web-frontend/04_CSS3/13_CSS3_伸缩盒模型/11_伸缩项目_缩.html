<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>11_伸缩项目_缩</title>
    <style>
        .outer {
            width: 700px;
            height: 600px;
            background-color: skyblue;

            /* 开启弹性盒子 */
            display: flex;

            /* flex-wrap: wrap; */
        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: #888;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .inner1 {
            flex-shrink: 1;
        }
        .inner2 {
            width: 300px;
            flex-shrink: 2;
        }
        .inner3 {
            flex-shrink: 3;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner inner1">1</div>
        <div class="inner inner2">2</div>
        <div class="inner inner3">3</div>
    </div>
    <img src="../images/屏幕截图 2023-12-05 195801.png" alt="">
</body>
</html>
