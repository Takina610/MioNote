<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08_JS三元运算符</title>
</head>
<body>
  <script>
    // 三元运算符
    // 条件 ? 代码1 : 代码2

    let num1 = Number(prompt('输入第一个数'))
    let num2 = Number(prompt('输入第二个数'))

    alert(`更大的数字是${num1 > num2 ? num1 : num2}`)
  </script>
</body>
</html>
