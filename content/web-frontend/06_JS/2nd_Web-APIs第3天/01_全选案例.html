<!DOCTYPE html>

<html>

<head lang="en">
  <meta charset="UTF-8">
  <title>01_全选案例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
      border: 1px solid #c0c0c0;
      width: 500px;
      margin: 100px auto;
      text-align: center;
    }

    th {
      background-color: #09c;
      font: bold 16px "微软雅黑";
      color: #fff;
      height: 24px;
    }

    td {
      border: 1px solid #d0d0d0;
      color: #404060;
      padding: 10px;
    }

    .allCheck {
      width: 80px;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th class="allCheck">
        <input type="checkbox" name="" id="checkAll"> <span class="all">全选</span>
      </th>
      <th>商品</th>
      <th>商家</th>
      <th>价格</th>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米手机</td>
      <td>小米</td>
      <td>￥1999</td>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米净水器</td>
      <td>小米</td>
      <td>￥4999</td>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米电视</td>
      <td>小米</td>
      <td>￥5999</td>
    </tr>
  </table>
  <script>
    // 获取大复选框
    const checkAll = document.querySelector('#checkAll')
    // 获取所有小复选框
    const ckAll = document.querySelectorAll('.ck')
    checkAll.addEventListener('click', function () {
      // 只需让checkAll.checked的状态与ckAll的所有状态绑定在一起
      for (let i = 0; i < ckAll.length; i++) {
        ckAll[i].checked = this.checked
      }
    })

    // 小复选框控制大复选框
    for (let i = 0; i < ckAll.length; i++) {

      ckAll[i].addEventListener('click', function() {
      // 判断小复选框里的被选中的个数是不是等于总的小复选框的个数
      // 当 ckAll里的 checkbox的已经是 true的个数 等于 ckAll的长度时
      // checkAll.checked的状态就变成true
        checkAll.checked = document.querySelectorAll('.ck:checked').length === ckAll.length
      })
    }
  </script>
</body>

</html>
