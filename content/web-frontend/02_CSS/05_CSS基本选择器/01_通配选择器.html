<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_通配选择器</title>
    <style>
        /* 通配选择器: " * "  */
        * {
            color: orange;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1>欢迎来到土味官网，土的味道我知道</h1>
    <h2>土味情话</h2>
    <p>万水千山总是情，爱我一点行不行</p>
    <p>蓝莓，草莓，黑莓，今天你想我了没</p>
    <p>我心里给你留了一块地，我的死心塌地！</p>
</body>
</html>
