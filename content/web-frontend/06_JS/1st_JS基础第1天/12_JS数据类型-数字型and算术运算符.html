<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12_JS数据类型-数字型and算术运算符</title>
</head>
<body>
  <script>
    // JS是弱数据类型语言
    let num = 'pink'
    console.log(num)
    // java是强数据类型语言  int num = 10

    //算术运算符
    console.log(5 + 3)
    console.log(5 - 3)
    console.log(5 * 3)
    console.log(5 / 3)
    console.log(5 % 3)

  </script>
</body>
</html>
