<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>grid区域规划</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            padding: 30px;
            width: 80%;
            height: 500px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.491);

            display: grid;
            grid-template-areas: 
                "header header"
                "sidebar content"
                "footer footer";
            grid-template-columns: 1fr 3fr;
            grid-template-rows: auto 1fr auto;

            gap: 10px;
        }

        .header {
            background-color: blue;
            grid-area: header;
        }

        .sidebar {
            background-color: red;
            grid-area: sidebar;
        }

        .content {
            background-color: yellow;
            grid-area: content;
        }

        .footer {
            background-color: green;
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">header</div>
        <div class="sidebar">sidebar</div>
        <div class="content">content</div>
        <div class="footer">footer</div>
</body>
</html>
