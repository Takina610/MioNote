<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise_链式调用</title>
</head>

<body>
  <script>
    /**
     * 目标：掌握Promise的链式调用
     * 需求：把省市的嵌套结构，改成链式调用的线性结构
    */

    // 1.创建一个 promise对象，模拟请求省份名字
    const p = new Promise((resolve, reject) => {
      setTimeout(() => {
        resolve('江西省')
      }, 2000)
    })

    // 2.获取省份名字
    const p2 = p.then(result => {
      console.log(result)
      // 3.创建 promise对象，模拟请求城市名字
      // return Promise对象最终的结果和状态，影响到新的 Promise对象
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(result + ' --- 宜春市')
        }, 2000)
      })
    })

    p2.then(result => {
      console.log(result)
    })

    // 每个 then()方法都返回一个新的 Promise
    // then()原地的返回结果是一个新的 promise对象
    console.log(p2 === p) // false
  </script>
</body>

</html>
