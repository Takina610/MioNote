<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08_交换两个变量案例</title>
</head>
<body>
  <script>
    let a = 'Naruto'
    let b = 'Sasuke'
    let tmp
    console.log(a,b)

    tmp = a
    a = b
    b = tmp
    console.log(a,b)
  </script>
</body>
</html>
