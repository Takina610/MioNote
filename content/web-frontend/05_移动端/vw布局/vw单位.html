<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vw单位</title>
    <style>
        div {
            /* vw（Viewport Width）是CSS中的一个长度单位，
            代表视口宽度的百分比。1vw等于视口宽度的1%。
            这意味着，无论设备或浏览器窗口的实际像素宽度如何，100vw总是等于视口的完整宽度。 */

            /* 例如你的视口屏幕时375px宽时，那么，1vw等于3.75px。
            当盒子的大小要为100px的话，对应的vw就是100 / 3.75 = 26.666vw */
            width: 26.666vw;
            height: 26.666vw;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
