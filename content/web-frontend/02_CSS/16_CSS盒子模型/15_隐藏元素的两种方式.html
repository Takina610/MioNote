<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>15_隐藏元素的两种方式</title>
    <style>
        .one {
            background-color: seagreen;
            width: 200px;
            height: 200px;

            /* display: none; */
            visibility: hidden;
        }
        .two {
            background-color: slateblue;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="one"></div>
    <div class="two"></div>
    <img src="../images/Snipaste_2023-11-16_19-47-02.png" alt="">
</body>
</html>
