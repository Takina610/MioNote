<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_JS函数返回多个数据</title>
</head>
<body>
  <script>
    function getArrValue(arr = []) {
      let max = arr[0]
      let min = arr[0]
      
      for (let i = 1; i < arr.length; i++) {
        // 最大值
        if (arr[i] > max) {
          max = arr[i]
        }
        // 最小值
        if (arr[i] < min) {
          min = arr[i]
        }
      }
      // 返回多个数据：通过数组返回
      return [max, min]
    }
    // 建立一个数组接受
    let arr = getArrValue([2,3,67,1,0,23])
    console.log(arr)
  </script>
</body>
</html>
