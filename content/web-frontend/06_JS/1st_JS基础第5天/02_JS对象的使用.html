<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_JS对象的使用</title>
</head>
<body>
  <script>
    let phoneInformation = {
      goodsName: '华为mate60pro',
      number: '100012816024',
      weight: '0.55kg',
      address: '中国大陆',
      price: '5999元'
    }
    // 对象的使用 - 查
    console.log(phoneInformation.goodsName)

    // 对象的使用 - 改
    phoneInformation.price = '6999元'

    // 对象的使用 - 增
    phoneInformation.chip = '麒麟9000s'

    // 对象的使用 - 删
    // delete phoneInformation.chip (较少使用)

    console.log(phoneInformation)
  </script>
</body>
</html>
