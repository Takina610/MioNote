<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>03_文本修饰</title>
    <style>
        div {
            font-size: 30px;
        }
        .one {
            text-decoration: overline red;
        }
        .two {
            text-decoration: underline red;
        }
        .two1 {
            text-decoration: underline wavy red;
        }
        .two2 {
            text-decoration: underline dotted red;
        }
        .three {
            text-decoration: line-through red;
        }
        .four {
            text-decoration: none;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="one">尚硅谷1</div>
    <div class="two">尚硅谷2</div>
    <div class="two1">尚硅谷2</div>
    <div class="two2">尚硅谷2</div>
    <div class="three">尚硅谷3</div>
    <div class="four">尚硅谷4</div>
    <a class="four" href="https://www.baidu.com" target="_blank">尚硅谷4</a>
</body>
</html>
