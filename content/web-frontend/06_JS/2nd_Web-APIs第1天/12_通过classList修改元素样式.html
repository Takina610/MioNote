<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12_通过classList修改元素样式</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: pink;
    }
    .active {
      width: 300px;
      height: 300px;
      background: deepskyblue;
      border: 1px solid black;
      margin: 50px auto;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="box"></div>
  <script>
    const box = document.querySelector('.box')
    // classList  add() 
    box.classList.add('active')

    // remove() 类名不加点，并且是字符串
    box.classList.remove('active')

    // toggle() 切换：HTML标签里有还是没有，有就删掉，没有就添加
    box.classList.toggle('active')
  </script>
</body>
</html>
