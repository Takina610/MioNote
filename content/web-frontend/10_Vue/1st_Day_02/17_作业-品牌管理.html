<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17_作业-品牌管理</title>
  <link href="../favicon.ico" rel="shortcut icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <style>
    .red {
      color: red;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="container">
      <!-- 顶部搜索框模块 -->
      <div class="form-group">
        <div class="input-group">
          <h4>品牌管理</h4>
        </div>
      </div>

      <!-- 数据表格 -->
      <table class="table table-bordered table-hover mt-2">
        <thead>
          <tr>
            <th>编号</th>
            <th>资产名称</th>
            <th>价格</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(item, index) in list" :key="item.id">
            <td>{{item.id}}</td>
            <td>{{item.name}}</td>
            <!-- 如果价格超过100，就有red这个类 -->
            <td :class="{red: item.price > 100}">{{item.price}}</td>
            <td>{{item.time}}</td>
            <td><a href="#" @click.prevent="del(item.id)">删除</a></td>
          </tr>
          <tr style="background-color: #EEE" v-if="list.length > 0">
            <td>统计:</td>
            <td colspan="2">总价钱为: {{totalPrice}}</td>
            <td colspan="2">平均价: {{averagePrice}}</td>
          </tr>
        </tbody>
        <tfoot v-if="list.length === 0">
          <tr>
            <td colspan="5" style="text-align: center">暂无数据</td>
          </tr>
        </tfoot>
      </table>

      <!-- 添加资产 -->
      <form class="form-inline">
        <div class="form-group">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="资产名称" v-model.trim="name"/>
          </div>
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <div class="form-group">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="价格" v-model.number="price" @keyup.enter="add"/>
          </div>
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <!-- 阻止表单提交 -->
        <button class="btn btn-primary" @click.prevent="add">添加资产</button>
      </form>
    </div>
  </div>
  <script src="./vue.js"></script>
  <script>
    const defaultArr = [
        { id: 1, name: "外套", price: 199, time: new Date('2010-08-12') },
        { id: 2, name: "裤子", price: 34, time: new Date('2013-09-01') },
        { id: 3, name: "鞋", price: 25.4, time: new Date('2018-11-22') },
        { id: 4, name: "头发", price: 899, time: new Date('2020-12-12') }
      ]
    const app = new Vue({
      el: '#app',
      data: {
        name: "", // 名称
        price: '', // 价格
        list: JSON.parse(localStorage.getItem('dlist')) || defaultArr
      },
      methods: {
        del(id) {
          this.list = this.list.filter(item => item.id != id)
        },
        add() {
          if (this.name === "") {
            alert("请输入名称")
            return
          }
          if (typeof this.price !== "number" || this.price < 0) {
            alert("请输入有效数字")
            return
          }
          this.list.push({id: this.list.length + 1, name: this.name, price: this.price, time: new Date()})
          this.name = ''
          this.price = ''
        }
      },
      computed: {
        totalPrice() {
          return this.list.reduce((sum, item) => sum + item.price, 0)
        },
        averagePrice() {
          return (this.totalPrice / this.list.length).toFixed(2)
        }
      },
      watch: {
        list: {
          deep: true,
          immediate: true,
          handler(newValue) {
            localStorage.setItem('dlist', JSON.stringify(newValue))
          }
        }
      }
    })
  </script>


</body>

</html>
