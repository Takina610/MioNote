<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09_数字补0案例</title>
</head>
<body>
  <script>
    let num = prompt('请输入数字')

    num = num < 10 ? 0 + num : num
    
    alert(num)
  </script>
</body>
</html>
