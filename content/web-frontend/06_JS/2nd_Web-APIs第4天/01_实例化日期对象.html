<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_实例化日期对象</title>
</head>
<body>
  <script>
    // 实例化 new
    // 得到当前时间
    const date = new Date()
    console.log(date)

    // 得到指定时间
    const date1 = new Date('2024-4-1 08:30:10')
    console.log(date1)
  </script>
</body>
</html>
