<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>12_伪类选择器_否定伪类</title>
    <style>
        /* 选中div的儿子p元素，但排除类名为fail的元素 */
        /* div>p:not(.fail) {
            color: red;
        } */

        /* 选中div的儿子p元素，但排除title属性值以“你要加油啊”为开头的元素 */
        /* div>p:not([title^="你要加油啊"]) {
            color: red;
        } */

        /* 选中div的儿子p元素，但排除第一个儿子 */
        div>p:not(:first-child) {
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>张三：99分</p> 
        <p>李四：87分</p>
        <p>王五：79分</p>
        <p class="fail" title="你要加油啊">黄七：58分</p>
        <p class="fail" title="你要加油啊">老八：48分</p>
    </div>

</body>
</html>
