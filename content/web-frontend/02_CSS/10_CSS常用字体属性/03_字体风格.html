<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>03_字体风格</title>
    <style>
        .one {
            font-size: 100px;
            font-style: normal;
        }
        .two {
            font-size: 100px;
            font-style: italic;
            /* 推荐使用改属性值改变字体倾斜 */
        }
        .three {
            font-size: 100px;
            font-style: oblique;
        }
    </style>
</head>
<body>
    <div class="one">尚硅谷</div>
    <div class="two">尚硅谷</div>
    <div class="three">尚硅谷</div>
</body>
</html>
