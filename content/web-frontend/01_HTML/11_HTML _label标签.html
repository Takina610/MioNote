<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML表单常用控件</title>
</head>
<body>
    <form action="https://search.jd.com/search" target="_blank">
        
        <!--两种的label方式都可以-->
        
        <!--<label for="zhanghu">账户：</label>
        <input id="zhanghu" type="text" name="account"><br>-->

        <label>
        账户：<input type="text" name="account"><br>
        </label>
        
        <!--<label for="mima">密码：</label>
        <input id="mima" type="password" name="word"><br>-->

        <label>
        密码：<input type="password" name="word">
        </label>
        <br>
        
        性别：
        <label><input type="radio" name="gender" value="male">男</label>
        <label><input type="radio" name="gender" value="female">女</label>
        <br>
        
        爱好：
        <label><input type="checkbox" name="hobby" value="Basketball">打篮球</label>
        <label><input type="checkbox" name="hobby" value="Games">玩游戏</label>
        <label><input type="checkbox" name="hobby" value="Code">敲代码</label>
        <br>
        
        <input type="hidden" name="tag" value="123">
        
        <label for="qita">其他：</label>
        <textarea id="qita" name="other" cols="22" rows="4"></textarea>
        <br>
        
        <label for="jiguan">籍贯：</label>
        <select id="jiguan" name="place">              
            <option value="赣">江西省</option>
            <option value="粤">广东省</option>
            <option value="晋">山西省</option>
            <option value="蜀">四川省</option>
            <option value="湘">湖南省</option>
            <option value="" selected></option>
        </select>
        <br><br>

        <input type="submit" value="确认">
        <input type="reset" value="重置">
        <input type="button" value="检测账户是否被注册">
    </form>
</body>
</html>
