<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>选择器优先级_详细聊</title>
    <style>
        /* 
        格式：（a，b，c）
        a：ID 选择器的个数
        b：类，伪类，属性 选择器的个数
        c：元素，伪元素 选择器的个数
        */
        div {
            color: blue !important;  /* 权重大于一切 */
        }
    </style>
</head>
<body>
    <div style="color: red;">尚硅谷，让天下没有难学的技术！</div>
</body>
</html>
