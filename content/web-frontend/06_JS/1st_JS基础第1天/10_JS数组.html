<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10_JS数组</title>
</head>
<body>
  <script>
    // 1. 声明数组 (数组是有序的)
    let arr = ['刘德华', '黎明', '张学友', '郭富城', 'pink老师']

    // 2. 使用数组  数组名[索引号] 从0开始
    console.log(arr[0])
    alert(arr[4])

    // 3. 数组的长度 = 索引号 + 1
    console.log(arr.length)
  </script>
</body>
</html>
