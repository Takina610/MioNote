<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_事件监听</title>
</head>
<body>
  <button>点击</button>
  <script>
    // 事件监听
    // 事件源.addEventListener('事件类型', 执行函数)

    // 点击一个按钮，弹出一个对话框
    // 事件源：按钮
    const btn = document.querySelector('button')
    // 事件类型：点击 click '字符串'
    // 事件处理程序：弹出对话框
    btn.addEventListener('click', function () {
      alert('你点击了按钮')
    })

  </script>
</body>
</html>
