<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>03_颜色_第二种表示_tgb和rgba</title>
    <style>
        .two {
            color: rgb(255, 0, 0);
        }
        .three  {
            color: rgb(0, 255, 0);
        }
        .four {
            color: rgb(0, 0, 255);
        }
        .one {
            color: rgb(138, 43, 226);
        }
        .five {
            color: rgb(100%,0%,0%);
        }
        .six {
            color: rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1 class="one">尚硅谷</h1>
    <h1 class="two">尚硅谷</h1>
    <h1 class="three">尚硅谷</h1>
    <h1 class="four">尚硅谷</h1>
    <h1 class="five">尚硅谷</h1>
    <h1 class="six">尚硅谷</h1>
</body>
</html>
