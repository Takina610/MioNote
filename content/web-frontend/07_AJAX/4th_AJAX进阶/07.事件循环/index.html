<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件循环</title>
</head>

<body>
  
  <script>
    /*
      JavaScript 的事件循环（Event Loop）是其运行时环境的核心机制之一，使得JavaScript能够处理异步操作，即便它本身是单线程的。这一机制让JavaScript可以执行长时间运行的代码，如网络请求或定时器，而不会阻塞主线程。

      事件循环的基本原理
      1.调用栈（Call Stack）：
          JavaScript代码执行时首先会进入调用栈。如果一个函数执行，它就被推入栈中；当函数执行完毕，它就会从栈中弹出。这遵循后进先出（LIFO）的原则。

      2.事件队列（Event Queue）：
          当异步事件发生时（例如，一个HTTP请求完成），相应的回调函数将会被加入到事件队列中等待执行。事件队列遵循先进先出（FIFO）的原则。

      3.事件循环（Event Loop）：
          事件循环的工作是监视调用栈和事件队列。如果调用栈为空，事件循环就会从事件队列中取出第一个事件，并将其对应的回调函数推入调用栈中执行。
    */


    /**
     * 目标：阅读并回答执行的顺序结果
    */
    console.log(1)
    setTimeout(() => {
      console.log(2)
    }, 0)
    console.log(3)
    setTimeout(() => {
      console.log(4)
    }, 2000)
    console.log(5)
    
    /*
      调用栈（Call Stack）
        JavaScript的执行环境依赖于单个调用栈，用于追踪函数调用的序列。每当一个函数被调用，该函数的执行上下文被推入栈的顶部。当函数执行完成后，其执行上下文会从栈顶弹出，返回到之前的执行上下文。

      宿主环境（Host Environment）
        宿主环境提供了JavaScript代码执行的上下文环境。它不仅提供了全局对象和与之相关的方法和属性，还提供了事件循环机制本身以及API来处理外部事件（如DOM事件、网络请求等）和异步任务。宿主环境负责处理宏任务（如setTimeout、setInterval、I/O）和微任务（如Promise）的调度。

      任务队列（Task Queues）
        任务队列，或称为事件队列，是一个等待执行的回调函数的列表。这些回调函数通常是对异步事件的响应。当异步操作完成时，其回调函数被添加到任务队列中。如果存在多个任务队列（宏任务队列和微任务队列），它们将按照特定的优先级处理。
      
      事件循环（Event Loop）的工作流程
        1. 检查调用栈：事件循环首先检查调用栈是否为空。
        2. 执行任务：如果调用栈为空，事件循环将从任务队列中取出任务。如果任务是微任务，它将优先执行。当一个宏任务执行完成后，事件循环会处理所有的微任务队列，直到它为空。
        3. 渲染更新：在浏览器环境中，渲染更新通常在宏任务执行后和下一个宏任务开始前进行。
        4. 重复：继续检查调用栈，取出并执行任务队列中的下一个任务。
    */
  </script>
</body>

</html>
