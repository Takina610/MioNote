<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18_forEach语法</title>
</head>
<body>
  <script>

    // forEach适合遍历数组对象
    const fruits = ['apple', 'pear', 'banana']
    fruits.forEach(function(item, index) {
      console.log(item, index)
      // item: 数组元素
      // index: 索引号
    })
    
  </script>
</body>
</html>
