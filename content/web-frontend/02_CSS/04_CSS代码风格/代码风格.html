<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代码风格</title>
    <style>
        
        /* 紧凑风格 -- 开发时推荐，便于维护和调试*/
        h1 {color: aqua; font-size: 100px;}
        
        /* 展开风格 -- 项目上线时推荐，可减小文件体积*/
        h1 {
            color: blanchedalmond;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <h1>欢迎来到CSS的学习</h1>
</body>
</html>
