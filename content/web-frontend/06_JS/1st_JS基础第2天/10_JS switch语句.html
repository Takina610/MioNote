<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10_JS switch语句</title>
</head>
<body>
  <script>
    let num1 = Number(prompt('请输入第一个数字'))
    let num2 = Number(prompt('请输入第二个数字'))

    let arithmeticSymbols = prompt('请输入算术符号')

    switch (arithmeticSymbols) {
      case '+':
        alert(`两数和为 ${num1 + num2}`)
        break
      case '-':
        alert(`两数差为 ${num1 - num2}`)
        break
      case '*':
        alert(`两数积为 ${num1 * num2}`)
        break
      case '/':
        alert(`两数相除为 ${num1 / num2}`)
        break
      default:
        alert('输入的算术符号不存在')
        break
    }
  </script>
</body>
</html>
