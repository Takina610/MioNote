<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_函数抽取和封装</title>
</head>
<body>
  <script>
    // 函数抽取（Function Extraction）
    //  函数抽取是指将代码中重复的部分或逻辑较为复杂的部分提取出来，
    //  形成一个独立的函数。这样做的目的是减少重复代码和提高代码的清晰度。
    //  当你在代码中看到相同或相似的代码段被重复多次时，
    //  或者一个函数体积过大、逻辑复杂难以理解时，就应该考虑进行函数抽取。

    // 函数封装（Function Encapsulation）
    //  函数封装是将一组完成特定功能的代码块封装成一个函数。
    //  这意味着把具体的实现细节隐藏起来，只暴露出一个简单的接口给外部使用。
    //  封装的好处在于它可以让代码更加模块化，使用者不需要知道函数内部是如何实现的，
    //  只需要知道如何调用这个函数即可。这样既保证了代码的安全性，也提高了代码的可用性和可维护性。

    // 举个例子
    //  假设你在写一个程序，需要多次计算两个数的和并打印出来。
    //  不使用函数抽取和封装，你可能会在需要计算和打印的地方重复写相同的代码。
    //  使用函数抽取和封装后，你可以创建一个函数，比如叫printSum，这个函数接受两个参数，
    //  计算它们的和并打印出来。这样，每次你需要进行计算和打印时，只需要调用 printSum函数即可。

    // 总结
    //  函数抽取：提高代码的重用性和清晰度，减少重复。
    //  函数封装：隐藏实现细节，提供简单的使用接口，增强代码的模块化和安全性。
  </script>
</body>
</html>
