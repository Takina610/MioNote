<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_创建一个Vue实例</title>
</head>
<body>
  <!-- 
    创建 Vue实例，初始化渲染
      1.准备容器（Vue所管理的范围）
      2.引包（开发版本包 / 生产版本包（官网找））
      3.创建实例
      4.添加配置项 => 完成渲染
    -->
  <div id="app">
    <!-- 这里将来会编写一些用于渲染的代码逻辑 -->
    <h1>{{ msg }}</h1>
    <a href="#">{{ count }}</a>
  </div>

  <!-- 引入的时是开发版本包 - 包含完整的注释和警告 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script> -->
  <script src="./vue.js"></script>

  <script>
    // 一旦引入 VueJS核心包，在全局环境，就有了 Vue构造函数
    const app = new Vue({
      // 通过 el配置选择器，指定 Vue管理的是哪个盒子（el指定挂载点）
      el: "#app",
      // 通过 data提供数据
      data: {
        msg: "Hello Vue.js",
        count: 666
      }
    })
  </script>
</body>
</html>
