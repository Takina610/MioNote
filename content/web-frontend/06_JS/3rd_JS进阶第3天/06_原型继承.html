<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_原型继承</title>
</head>
<body>
  <script>

    // 父
    function Person () {
      this.eyes = 2
      this.head = 1
    }

    // 子
    function Woman() { }
    function Man() { }
    
    // 通过原型继承 person
    Woman.prototype = new Person()
    // 指回 Woman
    Woman.prototype.constructor = Woman

    Woman.prototype.baby = function() {
      console.log('宝贝')
    }
    
    const red = new Woman()
    console.log(red)

    // 通过原型继承 person
    Man.prototype = new Person()
    // 指回 Man
    Man.prototype.constructor = Man
    
    const pink = new Man()
    console.log(pink)
  </script>
</body>
</html>
