<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12_环境对象</title>
</head>
<body>
  <button>点击</button>
  <script>
    // 每个函数都有 this 环境对象  普通函数里面的 this指向的是window
    // function fn() {
    //   console.log(this) // window对象
    // }
    // window.fn()

    const btn = document.querySelector('button')
    btn.addEventListener('click', function() {
      console.log(this) //回调函数里面的 this指向的是调用它的那个对象 也就是btn
    })

    // this所指向的初略规则：谁调用我我就指向谁
  </script>
</body>
</html>
