<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>06_浮动布局练习byteacher</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .leftfix {
            float: left;
        }
        .rightfix {
            float: right;
        }
        .clearfix::after {
            content: '';
            display: block;
            clear: both;
        }
        .container {
            width: 960px;
            margin: 0 auto;
            text-align: center;
        }
        .logo {
            width: 200px;
        }
        .banner1 {
            width: 540px;
            margin: 0 10px;
        }
        .banner2 {
            width: 200px;
        }
        .logo,.banner1,.banner2 {
            height: 80px;
            background-color: lightgray;
            line-height: 80px;
        }
        .menu {
            height: 30px;
            line-height: 30px;
            background-color: lightgray;
            margin: 10px 0;
        }
        .item1,.item2,.item3 {
            border: 1px solid black;    
            margin-bottom: 10px;
        }
        .item1 {
            height: 198px;
            width: 368px;
            margin-right: 10px;
            line-height: 198px;
        }
        .item2 {
            height: 198px;
            width: 178px;
            margin-right: 10px;
            line-height: 198px;
        }
        .item3 {
            height: 128px;
            width: 198px;
            line-height: 128px;
        }
        .foot {
            height: 60px;
            background-color: lightgray;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="page-header clearfix">
            <div class="logo leftfix">logo</div>
            <div class="banner1 leftfix">banner1</div>
            <div class="banner2 leftfix">banner2</div>
        </div>
        <!-- 菜单 -->
        <div class="menu">菜单</div>
        <!-- 内容区 -->
        <div class="content clearfix">
            <!-- 左内容区 -->
            <div class="left leftfix">
                <div class="top clearfix">
                    <div class="item1 leftfix">栏目一</div>
                    <div class="item1 leftfix">栏目二</div>
                </div>
                <div class="bottom clearfix">
                    <div class="item2 leftfix">栏目三</div>
                    <div class="item2 leftfix">栏目四</div>
                    <div class="item2 leftfix">栏目五</div>
                    <div class="item2 leftfix">栏目六</div>
                </div>
            </div>
            <!-- 右内容区 -->
            <div class="right rightfix">
                <div class="item3">栏目七</div>
                <div class="item3">栏目八</div>
                <div class="item3">栏目九</div>
            </div>
        </div>
         <div class="foot">页脚</div>
    </div>
</body>
</html>
