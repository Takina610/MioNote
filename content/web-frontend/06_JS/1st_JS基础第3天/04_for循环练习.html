<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_for循环练习</title>
  <style>
    div {
      width: 80px;
      height: 20px;
      line-height: 20px;
      box-sizing: border-box;
      border: 1px solid black;
      display: inline-block;
      text-align: center;
      margin: 2px;
      box-shadow: 1px 1px 1px black;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <script>
    for (let i = 1; i <= 9; i++) {
      for(let j = 1; j <= i; j++) {
        document.write(`<div>${i}×${j}=${i*j}</div>`)
      }
      document.write('<br>')
    }
  </script>
</body>
</html>
