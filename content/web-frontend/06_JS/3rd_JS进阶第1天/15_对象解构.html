<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15_对象解构</title>
</head>
<body>
  <script>
    // 对象解构  变量名和属性名必须相同
    // const {uname, age} = {uname: 'pink老师', age: 18}
    // console.log(uname, age)

    // 解构时可以重新命名
    // const {uname: name, age} = {uname: 'pink老师', age: 18}
    // console.log(name)

    // 解构数组对象
    const pig = [
      { uname: 'pink', age: 18 }, 
      { uname: 'red', age: 12 }, 
      { uname: 'green', age: 15 }
    ]
    const [ { uname, age } ] = pig
    console.log(uname, age) // pink 18
  </script>
</body>
</html>
