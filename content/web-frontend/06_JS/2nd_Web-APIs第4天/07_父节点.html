<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07_父节点</title>
</head>
<body>
  <div class="grandfather">
    <div class="father">
      <div class="son"></div>
    </div>
  </div>
  <script>
    const son = document.querySelector('.son')
    console.log(son) // 返回 dom对象
    console.log(son.parentNode) // 返回 dom对象
    console.log(son.parentNode.parentNode) // 返回 dom对象
  </script>
</body>
</html>
