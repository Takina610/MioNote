<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>语法规范</title>
    <style>
        /* 注意空格的书写位置 */
        h1/*选择器*/ {
            color/*属性名*/: aqua/*属性值*/;  /*声明块*/
            font-size/*属性名*/: 40px/*属性值*/; /*声明块*/
        }
    </style>
</head>
<body>
    <h1>欢迎进入CSS的学习</h1>
</body>
</html>
