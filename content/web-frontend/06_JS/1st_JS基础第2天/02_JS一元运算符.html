<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_JS一元运算符</title>
</head>
<body>
  <script>
    // + - 号为一运算符
    console.log(+'123')

    //前置递增
    let i = 1
    ++i
    console.log(i)

    //后置递增
    let k = 1
    console.log(k)
  </script>
</body>
</html>
