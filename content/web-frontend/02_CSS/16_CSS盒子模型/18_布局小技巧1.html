<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>18_布局小技巧1</title>
    <style>
        .outer {
            height: 400px;
            width: 400px;
            background-color: gray;

            overflow: hidden;
        }
        .inner {
            height: 100px;
            width: 200px;
            background-color: orange;

            text-align: center;
            line-height: 100px;

            /* (400-100) / 2 = 150 (margin-top) */
            /* margin: 0 auto;
            margin-top: 150px; */

            /* (400-(100+5*2+5*2)) / 2 = 140 (margin-top) */
            padding: 5px;
            border: 5px solid red;
            
            margin: 0 auto;
            margin-top: 140px;

            font-weight: bold;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">inner</div>   
    </div>
</body>
</html>
