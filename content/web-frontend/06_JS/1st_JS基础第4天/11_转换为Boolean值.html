<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11_转换为Boolean值</title>
</head>
<body>
  <script>
    console.log(Boolean('pink')) // true
    console.log(Boolean(1)) // true

    // ''、0、undefined、null、false、NaN 转换为 Boolean值都为 false，其余都为 true
  </script>
</body>
</html>
