  <title>13_必须加分号的两种情况</title>

<body>
  <script>
    // 立即执行函数后面必须加分号
    (function () { })();

    // 直接使用数组时，必须加分号
    const str = 'pink';
    [1, 2, 3].map(function (item) {
      console.log(item)
    })

    let a = 1
    let b = 2;
    [a, b] = [b, a]
    console.log(a, b)
  </script>
