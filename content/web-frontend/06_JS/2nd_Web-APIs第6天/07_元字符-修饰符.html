<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07_元字符-修饰符</title>
</head>
<body>
  <script>
    /*
      1. i（忽略大小写）
      使匹配不区分大小写。例如，/abc/i 会同时匹配 "abc"、"Abc"、"aBc" 和 "ABC"。
      2. g（全局搜索）
      不是在找到第一个匹配后停止，而是继续寻找字符串中的所有匹配项。例如，/ab/g 会找到字符串中的所有 "ab"。
      3. m（多行模式）
      使边界字符 ^ 和 $ 分别匹配多行输入字符串中的行开头和行结尾，而不仅仅是整个字符串的开头和结尾。
      4. s（允许 . 匹配换行符）
      在此模式下，. 特殊字符还可以匹配换行符 \n。默认情况下，. 不匹配换行符。
      5. u（Unicode 模式）
      使用 Unicode 模式，允许正则表达式正确理解 Unicode 字符。这对于处理多语言文本特别有用。
      6. y（粘附模式）
      粘附模式会确保匹配必须从目标字符串的当前位置开始。
    */
  </script>
</body>
</html>
