<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07_navigator对象</title>
</head>
<body>
  <script>
    /*
    navigator对象是浏览器对象模型（BOM）的一部分，提供了有关浏览器本身的信息。
    它可以用来获取浏览器的名称、版本、所在的操作系统、语言偏好等信息。
    navigator对象对于检测浏览器的功能、进行特性检测以及个性化用户体验非常有
    */

    console.log(navigator.userAgent)
  </script>
</body>
</html>
