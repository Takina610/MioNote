<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>11_margin的注意事项3</title>
    <style>
        #d1 {
            width: 200px;
            height: 200px;
            margin: 50px;
            background-color: deepskyblue;
        }
        img {
            margin: 50px;
        }
        .one {
            background-color: orange;
        }
        .two {
            background-color: blue;
            margin-left: 50px;
            margin-right: 50px;
            
            margin-top: 300px;
            margin-bottom: 300px;
        }
        .three {
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <!-- 对于行内元素来说，左右的 margin是可以完美设置的，上下的 margin设置后是无效的 -->
    <div>我是一段测试文字</div>
    <div id="d1">1</div>
    <div>我是一段测试文字</div>
    <img src="../images/悟空.jpg" alt="">
    <div>我是一段测试文字</div>
    <hr>
    <span class="one">人之初</span><span class="two">人之初</span><span class="three">人之初</span>

</body>
</html>
