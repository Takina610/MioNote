<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>06_细说font_size</title>
    <style>
        div {
            font-size: 40px;
            background-color: lightblue;
        }
        span {
            font-size: 40px;
            background-color: lightblue;
        }
        .one {
            font-family: "微软雅黑";
        }
        .two {
            font-family: "隶书";
        }
        .three {
            font-family: "翩翩体-简";
        }
    </style>
</head>
<body>
    <div>atguigux尚硅谷</div><br>
    <span class="one">尚</span>
    <span class="two">尚</span>
    <span class="three">尚</span>
    <br>
    <img src="../images/屏幕截图 2023-11-11 194629.png" alt="">
</body>
</html>
