<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16_页面输入输出案例</title>
</head>
<body>
  <script>
    let name = prompt('请输入你的名字:')
    let age = prompt('请输入你的年龄:')

    document.write(`我的名字是${name},我的年龄是${age}岁`)
  </script>
</body>
</html>
