<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09_JS变量的命名与规范</title>
</head>
<body>
  <script>
    /* 
    基本规则
      1.变量名区分大小写：JavaScript是区分大小写的语言，因此 variable和 Variable会被视为两个不同的变量。

      2.字母、数字、下划线和美元符号：变量名可以包含字母（a-z，A-Z）、数字（0-9）、
        下划线（_）和美元符号（$），但不能以数字开头。

      3.不能使用保留字：JavaScript有一系列保留字，不能用作变量名，例如 for、if、let、var、const等。

    命名约定
      1.驼峰命名法（CamelCase）：在JavaScript中广泛使用，第一个单词以小写字母开始，
        后续单词的首字母大写。例如：userName、shoppingCart。

      2.下划线命名法（snake_case）：所有单词小写，单词之间使用下划线连接。
        这种风格在JavaScript中较少见，但在某些情况下也会使用。例如：user_name、shopping_cart。

      3.帕斯卡命名法（PascalCase）：每个单词的首字母都大写，用于类名和构造函数。例如：User、ShoppingCart。

      4.美元符号（$）：一般用于特殊变量，如jQuery对象（$element）。

      5.大写字母：常量（不改变的变量）经常全部大写，单词之间用下划线分隔。例如：MAX_HEIGHT、API_KEY。
    */
  </script>
</body>
</html>
