<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>03_类选择器</title>
    <style>
        /* 选中页面中所有类名为speak的元素 */
        .speak {
            font-size: 20px;
            color: blue;
        }
        /* 选中页面中所有类名为answer的元素 */
        .answer {
            font-size: 20px;
            color: green;
        }
        /* 选中页面中所有类名为big的元素 */
        .big {
            color: red;
        }
    </style>
</head>
<body>
    <h1>欢迎来到土味官网，土的味道我知道</h1>
    <h2>土味情话</h2>
    <!-- 其中的"speak"和"answer"相当于一个类名 -->
    <!-- 一个标签不能写多个class属性，但是一个class属性可以写多个值 -->
    <!-- class属性不能是"纯数字" "中文" -->
    <p class="speak big">我对你说：万水千山总是情，爱我一点行不行</p>
    <p class="speak">我对你说：蓝莓，草莓，黑莓，今天你想我了没</p>
    <p class="speak">我对你说：我心里给你留了一块地，我的死心塌地！</p>
    <br>
    <h1>反杀土味官网，土的味道不让你知道</h1>
    <h2>反杀土味情话</h2>
    <p class="answer big">你回答我：一寸光阴一寸金，劝你死了这条心</p>
    <p class="answer">你回答我：西瓜，南瓜，哈密瓜，把你打成大傻瓜</p>
    <p class="answer">你回答我：我心里只有一块地，我的玛莎拉蒂！</p>
</body>
</html>
