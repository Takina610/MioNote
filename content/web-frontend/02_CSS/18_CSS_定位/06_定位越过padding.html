<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>06_定位越过padding</title>
    <style>
        .outer {
            width: 800px;
            height: 800px;
            background-color: #888;
            padding: 50px;

            position: relative;
        }
        .inner {
            width: 300px;
            height: 300px;
            background-color: orange;

            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">123</div>
    </div>
</body>
</html>
