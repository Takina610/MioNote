<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML表单基本结构</title>
</head>
<body>
    京东
    <form action="https://search.JD.com/search" target="_blank"> <!--"/s"的"s"表示search-->
       商品：<input type="text" name="keyword">
            <button>搜索</button>
    </form>
    <hr>
    bing
    <form action="https://www.cn.bing.com/search" target="_blank">
       问题：<input type="text" name="q">
            <button>搜索</button>
    </form>
    <hr>
    百度
    <form action="https://www.baidu.com/s" target="_blank">
       问题：<input type="text" name="wd">
            <button>搜索</button>
    </form>
</body>
</html>
