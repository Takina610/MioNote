<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年会抽奖</title>
  <style>
    .wrapper {
      width: 840px;
      height: 420px;
      background: url(./images/bg01.jpg) no-repeat center / cover;
      padding: 100px 250px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <strong>传智教育年会抽奖</strong>
    <h1>一等奖：<span id="one">???</span></h1>
    <h3>二等奖：<span id="two">???</span></h3>
    <h5>三等奖：<span id="three">???</span></h5>
  </div>
  <script>
    const nameList = ['刘德华', '周杰伦', 'pink老师', '张学友', '周星驰', '卢佳豪'];
    const span = document.querySelectorAll('span');

    for (let i = 0; i < span.length; i++) { // 确保循环基于span的数量
      if (nameList.length > 0) { // 如果 nameList中还有名字
        let randomIndex = Math.floor(Math.random() * nameList.length); // 生成一个随机索引
        span[i].innerHTML = nameList[randomIndex]; // 赋值给当前的span
        nameList.splice(randomIndex, 1); // 从名单中移除这个名字
      }
    }
</script>
</body>

</html>
