<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_字体大小</title>
    <style>
        /* 最小的px为12px 默认的是16px(chrome) */
        .one {
            font-size: 40px;
        }
        .two {
            font-size: 30px;
        }
        .three {
            font-size: 20px;
        }
        .four {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="one">尚硅谷</div>
    <div class="two">尚硅谷</div>
    <div class="three">尚硅谷</div>
    <div class="four">尚硅谷</div>
</body>
</html>
