<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>06_侧轴对齐方式_一行</title>
    <style>
        .outer {
            width: 1000px;
            height: 600px;
            background-color: skyblue;

            /* 开启弹性盒子 */
            display: flex;

            /* 设置侧轴对齐 */
            /* align-items: flex-start; */
            /* align-items: flex-end; */
            align-items: center;
            /* align-items: baseline; */
            
            /* 默认方式 */
            /* align-items: stretch; */

        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: #888;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .inner2 {
            height: 300px;
        }
        .inner3 {
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner inner1">1</div>
        <div class="inner inner2">2</div>
        <div class="inner inner3">3</div>
    </div>
    <img src="../images/屏幕截图 2023-12-05 142327.png" alt="">
</body>
</html>
