<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03_for循环嵌套</title>
</head>
<body>
  <script>
    for (let i = 1; i <= 3; i++) {
      document.write(`第${i}天<br>`)
      for(let j = 1; j <= 5; j++) {
        document.write(`记住了${j}个单词<br>`)
      }
      document.write('<br>')
    }
  </script>
</body>
</html>
