<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
     body {
      height: 98vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    div {
      width: 300px;
      height: 50px;
      border: 1px solid black;
      text-align: center;
      font-size: 20px;
      line-height: 50px;
    }
  </style>
</head>
<body>
  <div></div>
  <script>
    const div = document.querySelector('div')
    const date = new Date()
    // div.innerHTML = date.toLocaleString() // 2024/1/29 18:05:36
    // div.innerHTML = date.toLocaleDateString() // 2024/1/29
    // div.innerHTML = date.toLocaleTimeString() // 18:06:38
    // div.innerHTML = date.toDateString() // Mon Jan 29 2024
    div.innerHTML = date.toTimeString() // 18:08:05 GMT+0800 (中国标准时间)
  </script>
</body>
</html>
