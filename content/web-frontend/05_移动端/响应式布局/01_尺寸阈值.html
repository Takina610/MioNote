<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_尺寸阈值</title>
</head>
<body>
    超小屏幕（手机，竖屏）:
        小于 576px。这些通常是小型智能手机。

    小屏幕（手机，横屏）:
        576px 到 767px。这个区间通常包括大多数手机（横屏模式）和小型智能手机。

    中屏幕（平板）:
        768px 到 991px。这个区间通常包括平板电脑和较大屏幕的手机（横屏模式）。

    大屏幕（小型笔记本电脑和桌面显示器）:
        992px 到 1199px。这个区间通常是小型笔记本电脑和低分辨率的桌面显示器。

    超大屏幕（大型笔记本电脑和桌面显示器）:
        1200px 及以上。这个区间包括大多数的笔记本电脑和桌面显示器。
</body>
</html>
