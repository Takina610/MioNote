<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>grid-row-column</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .outer {
            width: 70%;
            height: 500px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.443);
            border-radius: 8px;
            padding: 30px;

            /* 开启网格布局 */
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
        }
        .inner {
            /* height: 100px; */
            background-color: blanchedalmond;
            border-radius: 8px;
        }
        .inner1 {
            grid-row: 1/3; /* 表示从第 1行开始，到第 3行结束 */
            grid-column: 1/3; /* 表示从第 1列开始，到第 3列结束 */
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner inner1">0</div>
        <div class="inner">1</div>
        <div class="inner">2</div>
        <div class="inner">3</div>
        <div class="inner">4</div>
        <div class="inner">5</div>
        <div class="inner">6</div>
        <div class="inner">7</div>
        <div class="inner">8</div>
        <div class="inner">9</div>
        <div class="inner">10</div>
        <div class="inner">11</div>
    </div>
</body>
</html>
