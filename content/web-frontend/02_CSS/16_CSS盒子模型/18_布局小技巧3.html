<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>18_布局小技巧3</title>
    <style>
        .inner {
            width: 400px;
            height: 400px;
            background-color: gray;

            text-align: center;
            line-height: 400px;
            
            font-size: 0px;
        }
        span {
            background-color: orange;
            font-size: 20px;
            
            vertical-align: middle;
        }
        img {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="inner">
        <span>
            你好啊？
            <img src="../images/悟空.jpg" alt="">
        </span>
    </div>
</body>
</html>
