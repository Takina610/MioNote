<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMLHttpRequest_基础使用</title>
</head>

<body>
  <div></div>
  <script>
    /**
     * XMLHttpRequest（XHR）是一种浏览器内置的API，它允许Web页面与服务器进行异步通信，即在不重新加载整个页面的情况下，
     * 对网页进行更新。XHR的出现极大地改变了Web开发的模式，它使得创建动态内容和构建富互联网应用（RIA）成为可能
    */
    /**
     * 目标：使用XMLHttpRequest对象与服务器通信
     *  1. 创建 XMLHttpRequest 对象
     *  2. 配置请求方法和请求 url 地址
     *  3. 监听 loadend 事件，接收响应结果
     *  4. 发起请求
    */

    // 1. 创建 XMLHttpRequest 对象
    const XHR = new XMLHttpRequest()

    // 2. 配置请求方法和请求 url 地址
    XHR.open('GET', 'http://hmajax.itheima.net/api/province')

    // 3. 监听 loadend 事件，接收响应结果
    XHR.addEventListener('loadend', () => {
      const dataObj = JSON.parse(XHR.response)
      document.querySelector('div').innerHTML = dataObj.list.join('<br>')
    })

    // 4. 发起请求
    XHR.send()
  </script>
</body>

</html>
