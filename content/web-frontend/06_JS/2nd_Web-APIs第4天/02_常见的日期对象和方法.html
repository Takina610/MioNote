<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_常见的日期对象和方法</title>
</head>
<body>
  <script>
    const date = new Date()
    console.log(date.getFullYear())
    console.log(date.getMonth() + 1) //取值是 0~11 要加一
    console.log(date.getDate())
    console.log(date.getDay()) // 星期几 取值是0~6 从星期日开始
    console.log(date.getHours())
    console.log(date.getMinutes())
    console.log(date.getSeconds())

  </script>
</body>
</html>
