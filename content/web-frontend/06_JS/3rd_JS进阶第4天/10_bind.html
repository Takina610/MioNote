<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10_bind</title>
</head>
<body>
  <script>
    const obj = {
      name: 'pink'
    }
    function fn() {
      console.log(this)
    }

    // 不会调用函数
    // 可以改变 this指向，返回的是一个函数
    const fun = fn.bind(obj)
    fun()
  </script>
</body>
</html>
