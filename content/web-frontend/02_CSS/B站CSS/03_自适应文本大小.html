<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>03_自适应文本大小</title>
    <style>
        .content {
            width: 500px;
            height: 600px;
            background-color: skyblue;
            resize: both;
            overflow: hidden;

            container-type: inline-size;
        }
        div p {
            font-size: 5cqw;
        }
    </style>
</head>
<body>
    <div class="content">
        <p>Lorem ipsum dolor sit amet, consectetur</p>    
    </div>
</body>
</html>
