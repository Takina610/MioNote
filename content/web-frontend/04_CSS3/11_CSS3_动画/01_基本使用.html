<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_基本使用</title>
    <style>
        .outer {
            width: 1000px;
            height: 400px;
            border: 1px solid black;
        }
        /* 定义一个动画（定义一组关键帧） */
        @keyframes right_move {
            /* 第一帧 */
            from {

            }
            /* 最后一帧 */
            to {
                transform: translate(801px);
                background-color: red;
            }
        }
        .inner {
            width: 200px;
            height: 400px;
            background-color: deepskyblue;

            /* 定义动画的名字 */
            animation-name: right_move;

            /* 说明动画移动的时间 */
            animation-duration: 5s;

            /* 动画延迟时间（可以解决元素动画时加颜色时在最开始的卡动效果）*/
            animation-delay: 0.5s;

        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
    <img src="../images/屏幕截图 2023-12-04 163645.png" alt="">
</body>
</html>
