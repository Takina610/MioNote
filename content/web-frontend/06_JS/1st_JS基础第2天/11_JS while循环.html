<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11_JS while循环</title>
</head>
<body>
  <script>
    let i = 0
    let end = Number(prompt('请输入你要输出的次数'))

    while (i <= end) {
      document.write('我要输出三次<br>')
      i++
    }
  </script>
</body>
</html>
