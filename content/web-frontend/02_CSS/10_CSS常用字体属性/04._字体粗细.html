<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04._字体粗细</title>
    <style>
        div {
            font-size: 100px;
        }
        .one {
            font-weight: lighter;
        }
        .two {
            font-weight: normal;
        }
        .three {
            font-weight: bold;
        }
        .four {
            font-weight: bolder;
        }
        .five {
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="one">尚硅谷1</div>
    <div class="two">尚硅谷2</div>
    <div class="three">尚硅谷3</div>
    <div class="four">尚硅谷4</div>
    <div class="five">尚硅谷5</div>
    <img src="../images/屏幕截图 2023-11-07 201328.png" alt="">
</body>
</html>
