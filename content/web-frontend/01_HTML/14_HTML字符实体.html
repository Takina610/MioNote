<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML字符实体</title>
</head>
<body>
    <div>哈哈&nbsp;&nbsp;&nbsp;哈哈</div>
    <div>哈哈&#160;&#160;&#160;哈哈</div>
    <br>
    <div>我们学了很多标题标签,其中&lt;h1&gt;是最厉害的</div>
    <div>表示空格的字符实体:&amp;nbsp;</div>
    <div>表示&的字符实体:&amp;amp;</div>
    <br>
    <div>这件商品的价格是￥199</div>
    <div>这件商品的价格是¥199</div>
    <div>这件商品的价格是&yen;199</div>
    <br>
    <div>©版权所有</div>
    <div>&copy;版权所有</div>
    <br>
    <div>2 * 2 = 4</div>
    <div>2 x 2 = 4</div>
    <div>2 × 2 = 4</div>
    <div>2 &times; 2 = 4</div>
    <br>
    <div>2 / 2 = 1</div>
    <div>2 ÷ 2 = 1</div>
    <div>2 &divide; 2 = 1</div>
</body>
</html>
