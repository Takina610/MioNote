<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_JS对象的方法</title>
</head>
<body>
  <script>
    let singer = {
      singerName: '刘德华',
      // 方法
      song: function () {
        console.log('冰雨')
      }
    }

    // 方法调用 对象名.方法名
    singer.song
  </script>
</body>
</html>
