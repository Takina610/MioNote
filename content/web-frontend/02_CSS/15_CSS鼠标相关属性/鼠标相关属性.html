<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鼠标相关属性</title>
    <style>
        div {
            border: 2px solid green;
            width: 400px;
            height: 400px;
            background-color: lightblue;
            
            /* cursor: not-allowed; */
            cursor: url(../images/arrow.png),pointer;

        }
        button {
            
            cursor: pointer;
            
            color: red;
            border: 2px solid blue;
            background-color: seagreen;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div>
        把鼠标放进来看看
        <input type="text" name="" id="">
        <a href="https://www.baidu.com" target="_blank">百度</a><br>
        <button>点我</button>
    </div>
</body>
</html>
