<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>07_定位的特殊应用2</title>
    <style>
        .outer {
            width: 800px;
            height: 400px;
            background-color: #888;

            position: relative;
        }
        .inner {
            width: 400px;
            height: 100px;
            background-color: orange;

            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">123</div>
    </div>
    <img src="../images/Snipaste_2023-11-24_23-40-21.png" alt="">
</body>
</html>
