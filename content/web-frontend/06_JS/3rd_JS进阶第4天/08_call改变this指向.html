<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08_call改变this指向</title>
</head>
<body>
  <script>
    const obj = {
      name: 'pink'
    }
    function fn(x, y) {
      console.log(this)
      console.log(x + y)
    }

    fn.call(obj, 1, 2)
  </script>
</body>
</html>
