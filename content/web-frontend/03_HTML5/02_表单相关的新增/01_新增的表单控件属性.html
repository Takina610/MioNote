<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>01_新增的表单控件属性</title>
</head>
<body>
    <form action="#">
        账号：<input
                type="text" 
                name="account" 
                placeholder="请输入账号" 
                required
                autofocus 
                autocomplete="on"
                pattern="\w{6}"
            >           
        <br>
        密码：<input
                type="password"
                name="pwd"
                placeholder="请输入密码"
                pattern="\w{6}"
            >
        <br>
        性别：
        <input type="radio" value="female" name="gender">女
        <input type="radio" value="male" name="gender" required>男
        <br>
        爱好：
        <input type="checkbox" name="hobby" value="smoke" required>抽烟
        <input type="checkbox" name="hobby" value="drink">喝酒
        <input type="checkbox" name="hobby" value="game">游戏
        <br>
        其他：
        <textarea name="other" cols="30" rows="10" required></textarea>
        <br>
        <button>提交</button>
    </form>
    <img src="../images/screenshot_20231129_093615.png" alt="">
</body>
</html>
