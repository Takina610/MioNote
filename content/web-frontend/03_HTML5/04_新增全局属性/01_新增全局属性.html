<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_新增全局属性</title>
    <style>
        .content {
            width: 300px;
            height: 300px;
            background-color: gold;
            color: blue;
            font-size: 40px;
            border: 1px solid black;
            margin: auto;
        }
        .box1 {
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="content" contenteditable="true">你好啊</div>

    <!-- 配合 JS 使用 -->
    <div class="content box1" draggable="true">你好啊</div>
    <img src="../images/屏幕截图 2023-11-30 000310.png" alt="">
</body>
</html>
