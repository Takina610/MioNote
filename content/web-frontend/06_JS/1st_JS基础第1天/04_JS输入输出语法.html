<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_JS输入输出语法</title>
</head>
<body>
  <script>
    // 1.输出语法 (文档输出内容)
    document.write('Hello World!')
    document.write('<h1>Hello World!</h1>')

    // 2.输出语法 (弹出警告框)
    alert('警告')

    // 3.输出语法 (控制台打印内容)
    console.log('Hello World!')

    // 4.输入语法
    prompt('请输入你的内容:')
  </script>
</body>
</html>
