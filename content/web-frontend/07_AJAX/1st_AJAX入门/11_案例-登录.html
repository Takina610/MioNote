<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11_案例-登录</title>
  <!-- 引入bootstrap.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
  <!-- 公共 -->
  <style>
    html,
    body {
      background-color: #EDF0F5;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 520px;
      height: 540px;
      background-color: #fff;
      padding: 60px;
      box-sizing: border-box;
    }

    .container h3 {
      font-weight: 900;
    }
  </style>
  <!-- 表单容器和内容 -->
  <style>
    .form_wrap {
      color: #8B929D !important;
    }

    .form-text {
      color: #8B929D !important;
    }
  </style>
  <!-- 提示框样式 -->
  <style>
    .alert {
      transition: .5s;
      opacity: 0;
    }

    .alert.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>欢迎-登录</h3>
    <!-- 登录结果-提示框 -->
    <div class="alert alert-success" role="alert">
      提示消息
    </div>
    <!-- 表单 -->
    <div class="form_wrap">
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">账号名</label>
          <input type="text" class="form-control username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">密码</label>
          <input type="password" class="form-control password">
        </div>
        <button type="button" class="btn btn-primary btn-login"> 登 录 </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    // 目标1：点击登录时，用户名和密码长度判断，并提交数据和服务器通信
    const verifyUsername = /^[\u4e00-\u9fa5a-zA-Z0-9]{8,}$/
    const verifyPassword = /^.{6,}$/

    const myAlert = document.querySelector('.alert')
    // 封装显示提示框函数
    function showAlert(message, isSuccess) {
      myAlert.classList.add('show')
      myAlert.innerHTML = message

      const bgstyle = isSuccess ? 'alert-success' : 'alert-danger'
      myAlert.classList.add(bgstyle)
      setTimeout(() => {
        myAlert.classList.remove('show')
        // 避免类名冲突，删除已经存在的类名
        myAlert.classList.remove(bgstyle)
      }, 2000)
    }

    // 绑定点击登录按钮事件
    document.querySelector('.btn-login').addEventListener('click', () => {
      const usernameValue = document.querySelector('.username').value
      const passwordValue = document.querySelector('.password').value
      // 判断用户名和密码是否符合要求
      if (!verifyUsername.test(usernameValue)) {
        showAlert('用户名必须大于等于8位且由中英文和数字组成', false)
        return // 阻止代码继续进行
      }
      if (!verifyPassword.test(passwordValue)) {
        showAlert('密码必须大于等于6位', false)
        return
      }

      axios({
        url: 'http://hmajax.itheima.net/api/login',
        method: 'POST',
        data: {
          username: usernameValue,
          password: passwordValue
        }
      }).then(result => {
        // console.log(result.data.message)
        showAlert(result.data.message, true)
      }).catch(error => {
        // console.log(error.response.data.message)
        showAlert(error.response.data.message, false)
      })
    })
  </script>
</body>

</html>
