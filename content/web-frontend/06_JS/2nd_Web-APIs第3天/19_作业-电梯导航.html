<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            height: 3000px;
        }

        .aside {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .item {
            height: 40px;
            line-height: 40px;
            text-align: center;
            padding: 0 10px;
            cursor: pointer;
        }

        .active {
            background-color: red;
            color: #fff;
        }

        .content {
            width: 660px;
            margin: 400px auto;
        }

        .neirong {
            height: 300px;
            margin-bottom: 20px;
            color: #fff;
        }

        .content1 {
            background-color: red;
        }

        .content2 {
            background-color: blue;
        }

        .content3 {
            background-color: orange;
        }

        .content4 {
            background-color: yellowgreen;
        }
    </style>
</head>

<body>

    <div class="aside">
        <div class="item" data-name="clothing">男装/女装</div>
        <div class="item" data-name="child">儿童服装/游乐园</div>
        <div class="item" data-name="electronic">电子产品</div>
        <div class="item" data-name="movie">电影/美食</div>
    </div>

    <div class="content">
        <div class="neirong content1 content_clothing">男装/女装</div>
        <div class="neirong content2 content_child">儿童服装/游乐园</div>
        <div class="neirong content3 content_electronic">电子产品</div>
        <div class="neirong content4 content_movie">电影/美食</div>
    </div>

    <script>
        const aside = document.querySelector('.aside')
        aside.addEventListener('click', function(event) {
            if (event.target.tagName === 'DIV') {
                if (document.querySelector('.active')) {
                    document.querySelector('.active').classList.remove('active')
                }
                event.target.classList.add('active')
                
                const old = document.querySelector(`.content_${event.target.dataset.name}`).offsetTop
                document.documentElement.scrollTop = old
            }
        })

        
        window.addEventListener('scroll', function() {
            if (document.querySelector('.active')) {
                    document.querySelector('.active').classList.remove('active')
                }

            const content_clothing = document.querySelector('.content_clothing')
            const content_child = document.querySelector('.content_child')
            const content_electronic = document.querySelector('.content_electronic')
            const content_movie = document.querySelector('.content_movie')
            const n = document.documentElement.scrollTop

            if (n >= content_clothing.offsetTop && n < content_child.offsetTop) {
                document.querySelector('[data-name=clothing]').classList.add('active')
            } else if (n >= content_child.offsetTop && n < content_electronic.offsetTop) {
                document.querySelector('[data-name=child]').classList.add('active')
            } else if (n >= content_electronic.offsetTop && n < content_movie.offsetTop) {
                document.querySelector('[data-name=electronic]').classList.add('active')
            } else if (n >= content_movie.offsetTop){
                document.querySelector('[data-name=movie]').classList.add('active')
            }
        })
    </script>
</body>

</html>
