<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20_作业-QQ音乐10屏轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
        }
        .img-box {
            width: 700px;
            height: 320px;
            /* background-color: blue; */
            position: relative;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.71);
        }
        .img-box .pic {
            width: 100%;
        }
        .img-box .tip .text {
            width: 100%;
            height: 53px;
            background-color: rgba(0, 0, 0, 0.71);
            position: absolute;
            bottom: 0px;
            color: greenyellow;
            font-size: 35px;
            line-height: 53px;
            padding-left: 10px;
        }
        .img-box .tip ul {
            display: flex;
            list-style: none;
            align-items: center;
        }
        .img-box .tip ul li {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgb(0, 0, 0);
            margin-right: 20px;
            margin-top: 10px;
        }
        .img-box .tip ul .active {
            width: 15px;
            height: 15px;
        }
    </style>
</head>

<body>
    <div class="img-box">
        <img class="pic" src="images/b01.jpg" alt="第1张图的描述信息">
        <div class="tip">
            <h3 class="text">挑战云歌单，欢迎你来</h3>
            <ul>
                <li class="active"></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>

    <script>
        // 数据
        const data = [
            {
                imgSrc: 'images/b01.jpg',
                title: '挑战云歌单，欢迎你来'
            },
            {
                imgSrc: 'images/b02.jpg',
                title: '田园日记，上演上京记'
            },
            {
                imgSrc: 'images/b03.jpg',
                title: '甜蜜攻势再次回归'
            },
            {
                imgSrc: 'images/b04.jpg',
                title: '我为歌狂，生为歌王'
            },
            {
                imgSrc: 'images/b05.jpg',
                title: '年度校园主题活动'
            },
            {
                imgSrc: 'images/b06.jpg',
                title: 'pink老师新歌发布，5月10号正式推出'
            },
            {
                imgSrc: 'images/b07.jpg',
                title: '动力火车来到西安'
            },
            {
                imgSrc: 'images/b08.jpg',
                title: '钢铁侠3，英雄镇东风'
            },
            {
                imgSrc: 'images/b09.jpg',
                title: '我用整颗心来等你'
            },
        ]
        const img = document.querySelector('.img-box .pic')
        const text = document.querySelector('.tip .text')

        let i = 0
        setInterval(function() {
            i++
            if (i === data.length) {
                i = 0
            }
            img.src = data[i].imgSrc
            text.innerHTML = data[i].title

            document.querySelector(`.active`).classList.remove('active')
            document.querySelector(`.tip li:nth-child(${i + 1})`).classList.add('active')
        },1000)
    </script>
</body>

</html>
