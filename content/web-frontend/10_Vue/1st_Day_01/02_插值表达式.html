<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_插值表达式</title>
</head>
<body>

  <!-- 
    插值表达式 
      作用：利用表达式进行插值渲染
      语法： {{ 表达式 }}

    注意点：
      1.使用的数据要存在
      2.支持的是表达式，不是语句 if，for
      3.不能再标签属性中使用 {{ }}
  --> 

  <div id="app">
    <p>{{ nickname }}</p>
    <p>{{ nickname.toUpperCase() }}</p>
    <p>{{ nickname + '你好' }}</p>
    <p>{{ age >= 18 ? '成年' : '未成年' }}</p>
    <p>{{ friend.hobby }}</p>
    <p>{{ friend.name }}</p>
  </div>

  <script src="./vue.js"></script>

  <script>
    const app = new Vue({
      el: "#app",
      data: {
        nickname: "tony",
        age: 18,
        friend: {
          name: 'pony',
          hobby: '热爱学习Vue',
        },
      }
    })
  </script>
</body>
</html>
