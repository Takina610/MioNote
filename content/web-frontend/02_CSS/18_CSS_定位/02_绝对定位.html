<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>02_绝对定位</title>
    <style>
        .outer {
            width: 200px;
            background-color: skyblue;
            border: 1px solid black;
            padding: 20px;

            position: relative;
        }
        .box {
            width: 200px;
            height: 200px;
            font-size: 20px;
        }
        .box1 {
            background-color: #888;
        }
        .box2 {
            background-color: orange;
            /* 脱离文档流 */
            position: absolute;
            top: 220px;
            left: 20px;

            transition: 0.5s all linear;
        }
        .box3 {
            background-color: green;
        }
        .outer:hover .box2 {
            left: 220px;
        }
    </style>
</head>
    <div class="outer">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
    </div>
    <img src="../images/Snipaste_2023-11-23_19-36-06.png" alt="">
</html>
