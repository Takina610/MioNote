<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05_对象原型</title>
</head>
<body>
  <img src="./img/Snipaste_2024-02-22_15-24-05.png" alt="">
  <script>
    function Star() {}
    const ldh = new Star()

    // (实例)对象原型 __proto__ 指向构造函数的原型对象
    console.log(ldh.__proto__)
    console.log(ldh.__proto__ === Star.prototype) // true

    // 对象原型里的 constructor与构造函数的原型对象的 constructor是一样的
    console.log(ldh.__proto__.construtor === Star.prototype.construtor) // true

  </script>
</body>
</html>
