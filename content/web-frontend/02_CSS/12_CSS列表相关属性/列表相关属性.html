<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>列表相关属性</title>
    <style>
        .one {
            /* 列表符号 */
            /* list-style-type: "\1F44D"; */

            /* 列表符号位置 */
            /* list-style-position: inside; */

            list-style: "\1F44D" inside;
        }

        .two {
            /* 自定义列表符号 */
            /* list-style-image: url(../images/video.gif); */
            
            /* list-style-position: inside; */

            list-style: inside url(../images/video.gif);
        }

        li {
            background-color: green;
        }
    </style>
</head>
<body>
    <ul class="one">
        <li>《震惊！两男子竟然在教室做出这种事！》</li>
        <li>《一夜暴富指南》</li>
        <li>《给成功男人的五条指南》</li>
    </ul>
    
    <ul class="two">
        <li>《震惊！两男子竟然在教室做出这种事！》</li>
        <li>《一夜暴富指南》</li>
        <li>《给成功男人的五条指南》</li>
    </ul>
    
</body>
</html>
