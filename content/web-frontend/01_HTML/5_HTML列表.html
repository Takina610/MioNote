<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML列表</title>
</head>
<body>
    <div>
        <!--有序列表(Ordered List) li(List Items)-->
        <h2>游玩GTA5的步骤</h2>
        <ol>
            <li>下载Steam、Epic或R星启动器</li>
            <li>打开下载好的软件</li>
            <li>找到GTA5并购买后下载</li>
            <li>开始游玩</li>
            <li>
                <a href="https://store.steampowered.com/about/" target="_blank">Steam</a>
                <a href="https://www.epicgames.com/site/zh-CN/home" target="_blank">Epic</a>
                <a href="https://www.rockstargames.com/" target="_blank">R星启动器</a>
            </li>
        </ol>
    </div>

    <div>
        <!--无序列表(Unordered List) li(List Items)-->
        <!--本质上可以无限嵌套，但推荐最多三层-->
        <h2>在steam上游玩过的游戏</h2>
        <ul>
            <li>GTA5</li>
            <li>
                <span>
                    <p>荒野大镖客2(重要人物)</p>
                    <ul>
                        <li>亚瑟·摩根</li>
                        <li>达奇·范德林德</li>
                        <li>何西阿·马修斯</li>
                        <li>约翰·马斯顿</li>
                    </ul>
                </span>
            </li><br>
            <li>NBA2K23</li><br>
            <li>双人成行</li>
        </ul>   
    </div>

    <div>
        <!--自定义列表(Definition List) dt(Definition title) dd(Definition Description)-->
        <h2>如何更好的学习</h2>
        <dl>
            <dt>做好笔记</dt>
            <dd>笔记是我们以后复习的一个抓手</dd>
            <dt>多加练习</dt>
            <dd>只有敲出来的代码，才是自己的</dd>
            <dt>别怕出错</dt>
            <dd>错很正常的，改正后并记住，就是经验</dd>
        </dl>
    </div>
</body>
</html>
