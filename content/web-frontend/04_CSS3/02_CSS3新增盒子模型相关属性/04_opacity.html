<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04_opacity</title>
    <style>
        .box1 {
            width: 200px;
            height: 200px;
            background-color: red;
            font-size: 30px;
            opacity: 0.2;
        }
        .box2 {
            position: relative;
            display: inline-block;
        }
        img {
            box-shadow: 0px 0px 20px black;
        }
        h1 {
            position: absolute;
            top: 100px;
            width: 400px;
            background-color: black;
            color: white;
            font-size: 40px;
            line-height: 60px;
            text-align: center;

            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="box1">纳米好</div>
    <div class="box2">
        <img src="../images/你瞅啥.jpg" alt="">
        <h1>你瞅啥</h1>
    </div>
    <img src="../images/屏幕截图 2023-11-30 234248.png" alt="">
</body>
</html>
