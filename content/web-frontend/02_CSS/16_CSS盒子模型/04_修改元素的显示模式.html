<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04_修改元素的显示模式</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            line-height: 200px;
            
            display: inline-block;

            text-align: center;
            font-weight: normal;
            font-size: 40px;
            font-family: "华文行楷";
            font-style: italic;
            text-decoration: underline;
            cursor: not-allowed;
        }
        #one {
            background-color: hotpink;
        }
        #two {
            background-color: red;
        }
        #three {
            background-color: springgreen;
        }
        a {
            width: 200px;
            height: 200px;
            line-height: 200px;

            display: inline-block;

            text-align: center;
            font-weight: normal;
            font-size: 40px;
            font-family: "华文行楷";
            font-style: italic;
            text-decoration: none;
            background-color: lightblue;
        }
        a:visited {
            color: blue;
        }
    </style>
</head>
<body>
    <div id="one">你好啊!</div>
    <div id="two">你好啊!</div>
    <div id="three">你好啊!</div>
    <hr>
    <a href="https://www.baidu.com" target="_blank">百度</a>
</body>
</html>
