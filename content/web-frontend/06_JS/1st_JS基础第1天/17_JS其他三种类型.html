<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17_JS其他三种类型</title>
</head>
<body>
  <script>
    // true false 是布尔型字面量
    let isCool = true
    console.log(isCool)

    // 未定义类型 (声明一个变量未赋值就是 undefined)
    let num
    console.log(num)

    // 空类型 null
    let obj = null
    console.log(obj)
  </script>
</body>
</html>
