<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>优先级</title>
    <style>
        h1 {
            color: blanchedalmond;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <!--行内样式的优先级大于内部样式，但是内部样式和外部样式的优先级一样，但是后来者居上(谁后写听谁)-->
    <h1 style="color: aqua;">欢迎来到CSS的学习</h1>
    
</body>
</html>
