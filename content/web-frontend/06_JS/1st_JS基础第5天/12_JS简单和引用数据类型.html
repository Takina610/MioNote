<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12_JS简单和引用数据类型</title>
</head>
<body>
  <script>
    /*
    值类型：简单数据类型/基本数据类型，在存储时变量中存储的是值本身，因此叫做 值 类型
    例如：string， number， Boolean， undefined， null

    引用类型：复杂数据类型，在存储时变量中存储的仅仅是 地址（引用），因此叫做 引用数据 类型
    通过 new 关键字创建的对象（系统对象，自定义对象），如 Object，Array，Date
    */
  </script>
</body>
</html>
