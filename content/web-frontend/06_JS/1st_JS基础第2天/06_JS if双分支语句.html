<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_JS if双分支语句</title>
</head>
<body>
  <script>
    let user = prompt('请输入用户名')
    let pwd = prompt('请输入密码')

    if (user === 'pink' && pwd === '123456') {
      alert('登录成功')
    } else {
      alert('登录失败')
    }

    // Ctrl + D 可以直接选中一个单句
    // Ctrl + Shift + L 可以同时选中多个同种的单句
  </script>
</body>
</html>
