<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04_渐变小案例</title>
    <style>
        .box1 {
            width: 600px;
            height: 800px;
            border: 1px solid black;
            margin: 0 auto;
            padding: 20px;
            background-image: repeating-linear-gradient(transparent 0px, transparent 29px, gray 30px);
            background-clip: content-box;
        }
        .box2 {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            background-color: gray;
            border-radius: 50%;
            box-shadow: 0px 0px 15px black;
            background-image: radial-gradient(at 70px 70px,white, #333);
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
