<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_利用JSON实现深拷贝</title>
</head>
<body>
  <script>
    const obj = {
      uname: 'pink',
      age: 18,
      hobby: ['篮球', '足球'],
      family: {
        baby: '小pink'
      }
    }

    // 把对象转换为字符串
    // JSON.stringify()

    // 把字符串转化为对象
    // JSON.parse()

    const o = JSON.parse(JSON.stringify(obj))
    console.log(o)

    // 这种方法实现了对象的深拷贝，但仅适用于纯数据对象，不适用于包含方法、循环引用或特殊类型属性的对象。
  </script>
</body>
</html>
