<!DOCTYPE html>
<html>

<head lang="en">
  <meta charset="UTF-8">
  <title>20_作业-手风琴</title>
  <style>
    ul {
      list-style: none;
    }

    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 1200px;
      height: 400px;
      margin: 50px auto;
      border: 1px solid red;
      overflow: hidden;
    }

    div li {
      width: 240px;
      height: 400px;
      float: left;
      transition: all .5s;
    }

    div ul {
      width: 1200px;
    }
  </style>
</head>

<body>
  <div id="box">
    <ul>
      <li>
        <a href="#">
          <img src="./images/1.jpg" alt="">
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/2.jpg" alt="">
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/3.jpg" alt="">
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/4.jpg" alt="">
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/5.jpg" alt="">
        </a>
      </li>
    </ul>
  </div>
</body>
<script>
  const Lis = document.querySelectorAll('#box li')
  for (let i = 0; i < Lis.length; i++) {
    Lis[i].addEventListener('mouseenter', function() {
      // 排他思想，干掉所有人，复活我自己
      for (let j = 0; j < Lis.length; j++) {
        Lis[j].style.width = '100px'
      }
      this.style.width = '800px'
    })

    Lis[i].addEventListener('mouseleave', function() {
      for (let j = 0; j < Lis.length; j++) {
        Lis[j].style.width = '240px'
      }
    })
  }
</script>

</html>
