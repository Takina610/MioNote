<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>grid响应式布局</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 120vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .outer {
            width: 70%;
            height: 400px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.443);
            border-radius: 8px;
            padding: 30px;

            /* 开启网格布局 */
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 默认为三列 */
            gap: 30px;

            overflow: auto;
        }
        .inner {
            height: 100px;
            background-color: blanchedalmond;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .outer {
                grid-template-columns: 1fr; /* 屏幕宽度小于600px时，改为一列 */
            }
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">0</div>
        <div class="inner">1</div>
        <div class="inner">2</div>
        <div class="inner">3</div>
        <div class="inner">4</div>
        <div class="inner">5</div>
        <div class="inner">6</div>
        <div class="inner">7</div>
        <div class="inner">8</div>
    </div>
</body>
</html>
