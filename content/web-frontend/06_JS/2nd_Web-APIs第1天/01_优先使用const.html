<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_优先使用const</title>
</head>
<body>
  <script>
    // 对于 let 和 const 的选择，优先选择用 const
    // let在对于一些简单数据类型的值或引用类型的地址发生变化的时候，需要用 let
    // 建议在声明 数组 和 对象 时，用 const，
    // 这是因为，数组和对象是引用类型，里面存储的是地址，
    // 当你对该数组或对象进行操作时，改变的不会是栈区里存放的地址，而是堆区里存放的内容或数据

    // 建议在声明 数组 和 对象 时，用 const
  </script>
</body>
</html>
