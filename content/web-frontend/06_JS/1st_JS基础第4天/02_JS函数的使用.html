<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_JS函数的使用</title>
</head>
<body>
  <script>

    // 函数声明，这些函数体内的代码逻辑会被执行
    // 函数的命名同样使用驼峰命名法，开头最好使用动词
    function sayHi() {
      console.log('hi~~~')
    }

    // 函数调用 函数一次声明可以多次调用，只有函数被调用，函数才会被执行
    sayHi()
  </script>
</body>
</html>
