<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>02_文本间距</title>
    <style>
        div {
            font-size: 30px;
        }
        .one {
            /* 字母间距 */
            letter-spacing: 10px;
        }
        .two {
            /* 单词间距 */
            word-spacing: 10px;
        }
    </style>
</head>
<body>
    <div>You forget a thousand things everyday, how about make sure this is one of them.尚硅谷</div>
    <div class="one">You forget a thousand things everyday, how about make sure this is one of them.尚硅谷1</div>
    <div class="two">You forget a thousand things everyday, how about make sure this is one of them.尚硅谷2</div>
</body>
</html>
