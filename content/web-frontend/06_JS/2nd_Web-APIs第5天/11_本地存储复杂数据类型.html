<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11_本地存储复杂数据类型</title>
</head>
<body>
  <script>
    const obj = {
      uname: 'pink老师',
      age: '18',
      gender: '男'
    }
  
    // 存储复杂数据类型  无法直接使用
    // localStorage.setItem('object', obj)

    // 复杂数据类型存储必须转换为 JSON字符串存储
    localStorage.setItem('object', JSON.stringify(obj)) // 仍然是存储的是一个字符串
    // JSON 对象  属性和值有引号，而且引号同意是双引号

    console.log(localStorage.getItem('object')) //{"uname":"pink老师","age":"18","gender":"男"}

    // 把 JSON字符串转换为对象
    console.log(JSON.parse(localStorage.getItem('object')))
  </script>
</body>
</html>
