<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_BOM</title>
</head>
<body>
  <script>
    // BOM（Browser Object Model）指的是浏览器对象模型，
    // 它提供了独立于内容而与浏览器窗口交互的对象结构。
    // BOM可以让 JavaScript与浏览器窗口进行交互，
    // 例如控制浏览器窗口、读取屏幕尺寸、导航历史、定位URL等。BOM并没有正式的标准，
    // 但主要的浏览器实现了相似的 BOM。
  </script>
</body>
</html>
