<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>02_input新增的type属性</title>
</head>
<body>
    <form action="#">
        邮箱：<input type="email" name="email">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        url：<input type="url" name="url">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        数值：<input type="number" name="number" step="2" max="80" min="20">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        搜索：<input type="search" name="keyword">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        <!-- 主要作用在移动端 -->
        电话：<input type="tel" name="phone">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        范围：<input type="range" name="range" max="90" min="10" value="12">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        颜色：<input type="color" name="color">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        日期：<input type="date" name="date">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        月份：<input type="month" name="month">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        周：<input type="week" name="week">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        时间：<input type="time" name="time">
        <button>提交</button>
    </form>
    <br>
    <form action="#">
        日期+时间：<input type="datetime-local" name="datetime-local">
        <button>提交</button>
    </form>
    <br>
    <form action="#" novalidate>
        email: <input type="email" name="email">
        <button>提交</button>
    </form>
    <img src="../images/屏幕截图 2023-11-29 232708.png" alt="">
</body>
</html>
