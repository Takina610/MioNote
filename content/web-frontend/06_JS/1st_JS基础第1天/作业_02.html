<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业_02</title>
  <style>
    h2 {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      text-align: center;
      width: 650px;
      height: 100px;
      margin: 0 auto;
    }
    table,th,td {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h2>2024年1月消费支出</h2>
  
  <script>
    let bankCardAmount = Number(prompt('总金额：'))
    let waterBill = Number(prompt('水费：'))
    let electricityBill = Number(prompt('电费：'))
    let internetFee = Number(prompt('网费：'))
    let bankCardBalance = bankCardAmount - (waterBill + electricityBill + internetFee)
    document.write(`
        <table>
        <tr>
          <th>银行卡总金额</th>
          <th>水费</th>
          <th>电费</th>
          <th>网费</th>
          <th>银行卡余额</th>
        </tr>
        <tr>
          <td>${bankCardAmount}元</td>
          <td>${waterBill}元</td>
          <td>${electricityBill}元</td>
          <td>${internetFee}元</td>
          <td>${bankCardBalance}元</td>
        </tr>
      </table>
    `)
    
  </script>
</body>
</html>
