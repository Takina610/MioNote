<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生信息管理</title>
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    姓名：<input type="text" class="uname" name="uname" />
    年龄：<input type="text" class="age" name="age" />
    性别:
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    薪资：<input type="text" class="salary" name="salary" />
    就业城市：<select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">录入</button>
  </form>

  <h1>就业榜</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- 
        <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr> 
        -->
    </tbody>
  </table>
  <script>
    // 获取元素
    const uname = document.querySelector('.uname')
    const age = document.querySelector('.age')
    const gender = document.querySelector('.gender')
    const salary = document.querySelector('.salary')
    const city = document.querySelector('.city')
    const tbody = document.querySelector('tbody')
    const items = document.querySelectorAll('[name]')
    // 声明一个空数组，增加和删除都是对这个数组进行操作
    const data = []
    // 录入模块
    // 表单提交事件
    const info = document.querySelector('.info')
    info.addEventListener('submit', function (event) {
      // 阻止默认行为 (阻止跳转)
      event.preventDefault()

      // 进行表单验证 如果输入数据有空，则报警报并 return
      for (let i = 0; i < items.length; i++) {
        if (items[i].value === '') {
          return alert('输入的内容不完全')
        }
      }

      const oneData = {
        stuId: data.length + 1,
        uname: uname.value,
        age: age.value,
        gender: gender.value,
        salary: salary.value,
        city: city.value
      }
      // 追加给数组
      data.push(oneData)
      // 提交完后，重置表单
      this.reset()

      // 调用渲染函数
      render()
    })

    // 添加需要渲染，删除也需要渲染，所以封装一个函数
    function render() {
      // 先清空 tbody 把新数组的数据重新渲染，否则会有重复出现一条数据的现象
      tbody.innerHTML = ''
      for (let i = 0; i < data.length; i++) {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td>${data[i].stuId}</td>
          <td>${data[i].uname}</td>
          <td>${data[i].age}</td>
          <td>${data[i].gender}</td>
          <td>${data[i].salary}</td>
          <td>${data[i].city}</td>
          <td>
            <a href="javascript:" data-id=${i}>删除</a>
          </td>
        `
        tbody.appendChild(tr)
      }
    }
    
    // 删除操作
    // 事件委托 tbody
    tbody.addEventListener('click', function(event) {
      if (event.target.tagName === 'A') {
        // 删除数据
        data.splice(event.target.dataset.id, 1)
        // 重新渲染
        render()
      }
    })
  </script>

</body>

</html>
