<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15_作业-切换图片</title>
</head>
<body>
  <input type="button" value="切换" id="btn"><br>
  <img src="img/1.jpg" width="300" id="img">
  <script>
    const arr = ["img/1.jpg", "img/01.gif", "img/02.gif", "img/2.jpg", "img/3.jpg"]

    const btn = document.querySelector('#btn')
    const img = document.querySelector('img')
    btn.addEventListener('click', function() {
      const random = parseInt(Math.random() * arr.length)
      img.src = arr[random]
    })
  </script>
</body>
</html>
