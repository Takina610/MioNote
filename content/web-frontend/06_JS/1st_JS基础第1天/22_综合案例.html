<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>22_综合案例</title>
  <style>
    h2 {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      height: 100px;
      width: 600px;
      text-align: center;
    }
    table,th,td {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h2>订单确认</h2>
  
  <script>
    // 1. 用户输入
    let price = Number(prompt('请输入商品单价：'))
    let num = Number(prompt('请输入商品数量：'))
    let address = prompt('请输入地址：')
    // 2. 计算总额
    let total = price * num
    // 3. 页面打印渲染
    document.write(`
        <table>
        <tr>
          <th>商品名称</th>
          <th>商品价格</th>
          <th>商品数量</th>
          <th>总价</th>
          <th>收货地址</th>
        </tr>
        <tr>
          <td>华为 mate60 pro</td>
          <td>${price}元</td>
          <td>${num}</td>
          <td>${total}元</td>
          <td>${address}</td>
        </tr>
      </table>
    `)
  </script>
</body>
</html>
