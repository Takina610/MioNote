<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03_元字符-量词</title>
</head>
<body>
  <script>
    // 1. *（星号）
    // 表示前面的元素可以出现零次或多次。
    // 例如，ab*c 可以匹配 "ac"、"abc"、"abbc"、"abbbc" 等。
    // 使用 * 匹配零次或多次
    let pattern1 = /bo*/;
    console.log(pattern1.test("A ghost booooed")); // true
    console.log(pattern1.test("A bird warbled")); // true

    // 2. +（加号）
    // 表示前面的元素至少出现一次。
    // 例如，ab+c 可以匹配 "abc"、"abbc"、"abbbc" 等，但不会匹配 "ac"。
    // 使用 + 匹配一次或多次
    let pattern2 = /bo+/;
    console.log(pattern2.test("A ghost booooed")); // true
    console.log(pattern2.test("A bird warbled")); // false

    // 3. ?（问号）
    // 表示前面的元素最多出现一次，换句话说，它可以出现零次或一次。
    // 例如，ab?c 可以匹配 "ac" 和 "abc"。
    // 使用 ? 匹配零次或一次
    let pattern3 = /bo?/;
    console.log(pattern3.test("A ghost booooed")); // true
    console.log(pattern3.test("A bird warbled")); // true

    // 4. {n}（固定重复）
    // 表示前面的元素必须出现恰好 n 次。
    // 例如，a{3} 仅匹配 "aaa"。
    // 使用 {n} 匹配恰好 n 次
    let pattern4 = /bo{2}/;
    console.log(pattern4.test("A ghost booooed")); // true
    console.log(pattern4.test("A bird warbled")); // false

    // 5. {n,}（至少重复 n 次）
    // 表示前面的元素至少出现 n 次。
    // 例如，a{2,} 可以匹配 "aa"、"aaa"、"aaaa" 等。
    // 使用 {n,} 匹配至少 n 次
    let pattern5 = /bo{2,}/;
    console.log(pattern5.test("A ghost booooed")); // true
    console.log(pattern5.test("A bird warbled")); // false

    // 6. {n,m}（重复 n 到 m 次）
    // 表示前面的元素至少出现 n 次，但不超过 m 次。
    // 例如，a{2,4} 可以匹配 "aa"、"aaa"、"aaaa"，但不会匹配 "a" 或 "aaaaa"。
    // 使用 {n,m} 匹配 n 到 m 次
    let pattern6 = /bo{1,3}/;
    console.log(pattern6.test("A ghost booooed")); // true
    console.log(pattern6.test("A bird warbled")); // false
  </script>
</body>
</html>
