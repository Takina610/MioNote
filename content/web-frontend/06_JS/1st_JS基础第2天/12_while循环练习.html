    // 3.计算1-100之间的所有偶数和奇数和
    let i = 1
    let oddSum = 0
    let evenSum = 0
    while (i <= 100) {
      if (i % 2 === 0) {
        oddSum += i
      }
      else {
        evenSum += i
      }
      i++
    }
    document.write(`1-100之间的所有偶数和为：${oddSum}<br>`)
    document.write(`1-100之间的所有奇数和为：${evenSum}`)
  </script>
