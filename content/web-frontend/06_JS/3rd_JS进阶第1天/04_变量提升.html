<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_变量提升</title>
</head>
<body>
  <script>
    // 把所有 var声明的变量提升到当前作用域的最前面
    // 只提升声明，不提升赋值
    // console.log(num + '件')
    // var num = 10

    function fn() {
      console.log(num) // undefined
      var num = 10
    }
    fn()
  </script>
</body>
</html>
