<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09_history对象</title>
</head>
<body>
  <button>后退</button>
  <button>前进</button>
  <script>
    const back = document.querySelector('back:first-child')
    const forward = back.nextElementSibling

    back.addEventListener('click', function() {
      // history.back
      history.go(-1)
    })
    forward.addEventListener('click', function() {
      // history.forward
      history.go(1)
    })
  </script>
</body>
</html>
