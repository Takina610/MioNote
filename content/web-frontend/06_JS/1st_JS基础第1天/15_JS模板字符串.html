<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15_JS模板字符串</title>
</head>
<body>
  <script>
    // 模板字符串 用 ``包含数据， 用${变量名} 使用变量
    let age = 18
    document.write(`我今年${age}岁了`)
  </script>
</body>
</html>
