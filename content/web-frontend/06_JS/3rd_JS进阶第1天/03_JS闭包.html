<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03_JS闭包</title>
</head>
<body>
  <script>
    // 内层函数 + 外层函数变量 = 闭包(Closure)
    // function outer() {
    //   let a = 10
    //   function inner() {
    //     console.log(a)
    //   }
    //   inner()
    // }
    // outer()

    // 外部调用函数内部变量
    function outer() {
      let a = 10
      function inner() {
        console.log(a)
      }
      return inner
    }
    // fun === outer() === inner() === function inner() {}
    const fun = outer()
    fun()
    // outer()()
    // 闭包会造成内存泄漏
  </script>
</body>
</html>
