<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>18_布局小技巧2</title>
    <style>
        .outer {
            width: 400px;
            height: 400px;
            background-color: gray;

            /* 行内元素可以当成文本文字来设置 */
            text-align: center;
            line-height: 400px;

        }
        span {
            background-color: orange;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <span>出来玩啊？</span>
    </div>
</body>
</html>
