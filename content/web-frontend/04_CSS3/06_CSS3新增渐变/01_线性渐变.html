<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>01_线性渐变</title>
    <style>
        .box {
            width: 300px;
            height: 200px;
            border: 1px solid black;
            float: left;
            margin-left: 50px;
        }
        .box1 {
            background-image: linear-gradient(red,yellow,green);
        }
        .box2 {
            background-image: linear-gradient(to right,red,yellow,green);
            /* background-image: linear-gradient(to left,red,yellow,green); */
            /* background-image: linear-gradient(to right top,red,yellow,green); */
        }
        .box3 {
            background-image: linear-gradient(20deg,red,yellow,green);
        }
        .box4 {
            background-image: linear-gradient(red 50px, yellow 100px, green 150px);
        }
        .box5 {
            font-size: 80px;
            line-height: 200px;
            text-align: center;
            font-weight: bold;
            color: transparent;
            -webkit-background-clip: text;
            background-image: linear-gradient(70deg,red,yellow,green);
        }
    </style>
</head>
<body>
    <div class="box box1">默认情况（从上到下）</div>
    <div class="box box2">通过关键词调整线性渐变的方向</div>
    <div class="box box3">通过角度调整线性渐变的方向</div>
    <div class="box box4">调整线性渐变的方向</div>
    <div class="box box5">你好啊</div>
    <img src="../images/屏幕截图 2023-12-03 135623.png" alt="">
</body>
</html>
