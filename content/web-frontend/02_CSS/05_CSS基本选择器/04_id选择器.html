<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04_id选择器</title>
    <style>
        #earthy {
            color: blue;
        }
        #turn-earthy {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>欢迎来到土味官网，土的味道我知道</h1>
    <!-- 在CSS中id不能数字开头 -->
    <!-- id的值也不能有重复 -->
    <h2 id="earthy">土味情话</h2>
    <p>万水千山总是情，爱我一点行不行</p>
    <p>蓝莓，草莓，黑莓，今天你想我了没</p>
    <p>我心里给你留了一块地，我的死心塌地！</p>
    <br>
    <h1>反杀土味官网，土的味道不让你知道</h1>
    <h2 id="turn-earthy">反杀土味情话</h2>
    <p>一寸光阴一寸金，劝你死了这条心</p>
    <p>西瓜，南瓜，哈密瓜，把你打成大傻瓜</p>
    <p>我心里只有一块地，我的玛莎拉蒂！</p>
</body>
</html>
