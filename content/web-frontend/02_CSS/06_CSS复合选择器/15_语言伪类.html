<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>15_语言伪类</title>
    <style>
        div:lang(en) {
            color: red;
        }
        :lang(zh-CN) {
            color: blue;
        }
    </style>
</head>
<body>
    <div>11111</div>
    <div lang="en">good</div>
    <p>哈哈哈哈哈哈哈哈哈</p>
    <span>你好啊</span>
</body>
</html>
