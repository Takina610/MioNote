<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_元字符-预定义类</title>
</head>
<body>
  <script>
    /*
      1. \d
      匹配任何数字字符，等价于 [0-9]。
      2. \D
      匹配任何非数字字符，等价于 [^0-9]。
      3. \w
      匹配任何字母数字字符（包括下划线），等价于 [a-zA-Z0-9_]。
      4. \W
      匹配任何非字母数字字符（不包括下划线），等价于 [^a-zA-Z0-9_]。
      5. \s
      匹配任何空白字符（包括空格、制表符、换页符等），等价于 [ \t\n\r\f\v]。
      6. \S
      匹配任何非空白字符，等价于 [^ \t\n\r\f\v]。
      7. \b
      匹配一个单词边界，即字与空格间的位置。
      8. \B
      匹配非单词边界。
    */
  </script>
</body>
</html>
