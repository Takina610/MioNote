<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>09_项目在主轴的基准长度</title>
    <style>
        .outer {
            width: 1000px;
            height: 600px;
            background-color: skyblue;

            /* 开启弹性盒子 */
            display: flex;

            flex-wrap: wrap;
        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: #888;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .inner2 {
            /* 设置伸缩项目在主轴上的基准长度 */
            /* 若主轴时横向的，则宽度失效，若是纵向的，则高度失效 */
            flex-basis: 300px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner inner1">1</div>
        <div class="inner inner2">2</div>
        <div class="inner inner3">3</div>
    </div>
    <img src="../images/屏幕截图 2023-12-05 195054.png" alt="">
</body>
</html>
