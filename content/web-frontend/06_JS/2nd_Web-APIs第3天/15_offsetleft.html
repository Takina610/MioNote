<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15_offsetleft</title>
  <style>
    div {
      width: 200px;
      height: 200px;
      background-color: pink;
      margin: 100px;
    }
    p {
      width: 100px;
      height: 100px;
      background-color: purple;
      margin: 50px;
    }
  </style>
</head>
<body>
  <div>
    <p></p>
  </div>
  <script>
    const div = document.querySelector('div')
    const p = document.querySelector('p')

    console.log(div.offsetLeft) // 108 (body自带了8px的 margin)
    console.log(p.offsetLeft) // 158
    // 若是 div设置了绝对定位，则以 div为准，有点像子绝父相
  </script>
</body>
</html>
