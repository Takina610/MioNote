<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML补充一些标签</title>
</head>
<body>
    <div>
        <!--换行标签-->
        <a href="https://www.bilibili.com" target="_blank">去B站</a>
        <br>
        <a href="https://www.jd.com" target="_blank">去京东</a>
    </div>
    <div>
        <!--分割线-->
        <h1>第一章</h1>
        <p>xxxxxxxxxxxxxxxxxxxxxxxxxxxxx</p>
        <hr>
        <h1>第二章</h1>
        <p>xxxxxxxxxxxxxxxxxxxxxxxxxxxxx</p>
    </div>
    <div>
        <!--按原文显示-->
        <pre><strong>
            I    Love    You
              I  Love  You
                 Love
        </pre></strong>
    </div>
</body>
</html>
