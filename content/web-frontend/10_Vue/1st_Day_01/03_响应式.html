<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03_响应式</title>
</head>
<body>

  <div id="app">
    {{ msg }}
  </div>

  <script src="./vue.js"></script>

  <script>
    const app = new Vue({
      el: '#app',
      data: {
        // 响应式数据 -> 数据变化了，视图自动更新
        msg: '你好，黑马',
      },
    })

    // 访问 data中数据，是会被添加到实例上
    // 1. 访问数据   实例.属性名
    // 2. 修改数据   实例.属性名 = 新值
  </script>
</body>
</html>
