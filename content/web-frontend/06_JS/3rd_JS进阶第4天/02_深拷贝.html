<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_深拷贝</title>
</head>
<body>
  <script>
    const obj = {
      uname: 'pink',
      age: 18,
      hobby: ['篮球', '足球'],
      family: {
        baby: '小pink'
      }
    }
    function deepCopy(newObj, oldObj) {
      for (let k in oldObj) {
        // 先筛选数组
        if (oldObj[k] instanceof Array) {
          newObj[k] = []
          deepCopy(newObj[k], oldObj[k])
        } else if (oldObj[k] instanceof Object) {
          newObj[k] = {}
          deepCopy(newObj[k], oldObj[k])
        } else {
          newObj[k] = oldObj[k]
        }
      }
    }
    const o = {}
    deepCopy(o, obj)
    console.log(o)

    // 深拷贝使用函数递归实现
  </script>
</body>
</html>
