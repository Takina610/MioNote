<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>04_子代选择器</title>
    <style>
        /* 子代选择器的"子"就是儿子 */
        div > a {
            color: skyblue;
        }
        div > p > a {
            color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <a href="#">张三</a>
        <a href="#">李四</a>
        <a href="#">王五</a>
        <p>
            <a href="">赵六</a>
        </p>
    </div>
</body>
</html>
