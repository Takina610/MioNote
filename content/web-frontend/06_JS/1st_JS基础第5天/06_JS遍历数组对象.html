<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_JS遍历数组对象</title>
</head>
<body>
  <script>
    // 数组对象
    let students = [
      {name: '小明', age: 18, gender: '男', hometown: '河南省'},
      {name: '小红', age: 19, gender: '女', hometown: '河北省'},
      {name: '小刚', age: 17, gender: '男', hometown: '山西省'},
      {name: '小莉', age: 18, gender: '女', hometown: '山东省'},
    ]

    for (let i = 0; i < students.length; i++) {

      // console.log(students[i].name)

      for(let k in students[i]) {
        console.log(students[i][k])
      }
    }
  </script>
</body>
</html>
