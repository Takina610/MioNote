<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11_冒泡排序</title>
</head>
<body>
  <script>
    let arr = [2, 5, 3, 1, 4]

    for (let i = 0; i < arr.length-1; i++) {
      let tmp = 0
      for (let j = 0; j < arr.length-1 - i; j++) {
        if (arr[j] > arr[j+1]) {
          tmp = arr[j]
          arr[j] = arr[j+1]
          arr[j+1] = tmp
        }
      }
    }
    document.write(arr)
  </script>
</body>
</html>
