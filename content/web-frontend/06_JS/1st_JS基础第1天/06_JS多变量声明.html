<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06_JS多变量声明</title>
</head>
<body>
  <script>
    // 多个变量声明可以写到一起 （不推荐）
    // let age = 18, uname = '迪丽热巴'
    // console.log(age, uname)

    //多行变量声明有点长，但是容易阅读
    let age = 18
    let uname = '迪丽热巴'
    console.log(age, uname)
  </script>
</body>
</html>
